        - marketCap
        - revenueGrowth5y
        - roic
        - roe
        - debtToEquity
        - fcfMargin
        - dividendYield
        - investmentCommitteeVerdict
        - investmentCommitteeConfidence
        - tomNashConvictionScore
        - tomNashVerdict
        - decisionRecommendation
        - rankScore
        - rankExplanation
        - dataSource
        - fetchedAt
        - simulated
      properties:
        symbol: { type: string }
        name: { type: string }
        kind: { type: string }
        price: { type: number }
        sector: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        businessQualityScore: { type: number }
        businessQualityRating: { type: string }
        investmentQualityScore: { type: ["number", "null"] }
