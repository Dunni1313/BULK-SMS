        checkedAt:
          type: string

    BrokerPosition:
      type: object
      required: [symbol, qty, side, marketValue, avgEntryPrice, unrealizedPl]
      properties:
        symbol:
          type: string
        qty:
          type: number
        side:
          type: string
        marketValue:
          type: number
        avgEntryPrice:
          type: number
        unrealizedPl:
          type: number

    BrokerPositionsResult:
      type: object
      required: [available, unavailableReason, positions, checkedAt]
      properties:
        available:
          type: boolean
        unavailableReason:
          type: ["string", "null"]
        positions:
          type: array
          items:
            $ref: "#/components/schemas/BrokerPosition"
        checkedAt:
          type: string

    NormalizedLocalStatus:
      type: string
      enum: [pending, open, closed, unknown]
      description: The local trades table's own coarse status vocabulary, normalized for comparison against NormalizedOrderStatus.

    ReconciliationIssueType:
      type: string
      enum: [missing_at_broker, missing_locally, status_mismatch, quantity_mismatch, symbol_mismatch]

    OrderReconciliationEntry:
      type: object
      required:
        [
          tradeId,
          alpacaOrderId,
          localSymbol,
          brokerSymbol,
          localStatus,
          brokerStatus,
          brokerRawStatus,
          localQuantity,
          brokerQuantity,
          filledQuantity,
          averageFillPrice,
          issues,
        ]
      properties:
        tradeId:
          type: ["integer", "null"]
        alpacaOrderId:
          type: ["string", "null"]
        localSymbol:
          type: ["string", "null"]
        brokerSymbol:
          type: ["string", "null"]
        localStatus:
          oneOf:
            - $ref: "#/components/schemas/NormalizedLocalStatus"
            - type: "null"
        brokerStatus:
          oneOf:
            - $ref: "#/components/schemas/NormalizedOrderStatus"
            - type: "null"
        brokerRawStatus:
          type: ["string", "null"]
        localQuantity:
          type: ["number", "null"]
        brokerQuantity:
          type: ["number", "null"]
        filledQuantity:
          type: ["number", "null"]
        averageFillPrice:
          type: ["number", "null"]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationIssueType"

    PositionReconciliationEntry:
      type: object
      required: [occSymbol, tradeId, localQuantity, brokerQuantity, mismatch, detail]
      properties:
        occSymbol:
          type: string
        tradeId:
          type: ["integer", "null"]
        localQuantity:
          type: ["number", "null"]
        brokerQuantity:
          type: ["number", "null"]
        mismatch:
          type: boolean
        detail:
          type: string

    ReconciliationResult:
      type: object
      required:
        [
          available,
          unavailableReason,
          generatedAt,
          localOrdersConsidered,
          brokerOrdersConsidered,
          orders,
          positions,
          issueCount,
          fullyReconciled,
        ]
      properties:
        available:
          type: boolean
          description: False when credentials are missing or Alpaca could not be reached/authenticated — never a fabricated reconciled result in that case.
        unavailableReason:
          type: ["string", "null"]
        generatedAt:
          type: string
          description: When this reconciliation was computed — the manual, on-demand "last reconciliation time."
        localOrdersConsidered:
          type: integer
          description: Count of local, trackable (non-mock, non-closed) trade records compared.
        brokerOrdersConsidered:
          type: integer
        orders:
          type: array
          items:
            $ref: "#/components/schemas/OrderReconciliationEntry"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PositionReconciliationEntry"
        issueCount:
          type: integer
        fullyReconciled:
          type: boolean
          description: True only when available and zero issues were found across every order and position entry.

    ReconciliationReportSummary:
      type: object
      required:
        [
          id,
          generatedAt,
          available,
          unavailableReason,
          localOrdersConsidered,
          brokerOrdersConsidered,
          issueCount,
          fullyReconciled,
          createdAt,
        ]
      properties:
        id:
          type: integer
        generatedAt:
          type: string
        available:
          type: boolean
        unavailableReason:
          type: ["string", "null"]
        localOrdersConsidered:
          type: integer
        brokerOrdersConsidered:
          type: integer
        issueCount:
          type: integer
        fullyReconciled:
          type: boolean
        createdAt:
          type: string
          description: When this snapshot was persisted (distinct from generatedAt, the moment the comparison itself ran).

    ReconciliationReportDetail:
      allOf:
        - $ref: "#/components/schemas/ReconciliationReportSummary"
        - type: object
          required: [detail]
          properties:
            detail:
              $ref: "#/components/schemas/ReconciliationResult"

