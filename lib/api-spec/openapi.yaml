  /trading/backtest/run:
    post:
      operationId: runTradingBacktest
      tags: [trading-backtest]
      summary: Run a genuine walk-forward price-action backtest for a symbol against a named strategy, persisting the result to the calling user's own history (read-only over historical candles; never places an order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingRunBacktestInput"
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingBacktestResult"
        "404":
          description: Unknown or invalid symbol

  /trading/backtest/results:
    get:
      operationId: listTradingBacktestResults
      tags: [trading-backtest]
      summary: List the calling user's own persisted backtest results, newest first
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradingBacktestResult"

  # ─── Options Engine-Native Backtesting (Phase 4, Sprint 58 — Route + UI,
  # conditional on Sprint 57's own Core output proving valuable). A genuine
  # bar-by-bar walk-forward simulation, distinct from the legacy
  # /backtest/run's fabricated-statistics generator (unmodified, left in
  # place as a parallel legacy path) — reuses Engine 2's MarketDataProvider
  # for the underlying spot price path and optionsMath.ts's own
  # getSnapshot() for IV, composed in lib/optionsBacktest.ts.
  /options-backtest/run:
    post:
      operationId: runOptionsBacktest
      tags: [options-backtest]
      summary: Run a genuine walk-forward options-strategy backtest for a symbol, persisting the result to the calling user's own history (read-only over historical candles and deterministic options pricing; never places an order)
