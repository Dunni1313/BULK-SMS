  # ─── Risk Management (Engine 2, Phase 3 Sprint 44) ──────────────────────────
  /trading/risk:
    get:
      operationId: getTradingRisk
      tags: [trading-risk]
      summary: Portfolio risk analysis over the calling user's own open trading positions — position sizing, stop/target discipline, and portfolio risk budget, SIMULATED-first, honestly reports insufficient data rather than fabricating a default account value or position
      responses:
        "200":
          description: Trading risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingRiskAnalysis"

  # Deliberately documents the path parameter only. The route also accepts
  # optional ?interval=&lookback= query overrides (defaulting to "1D"/90),
  # validated and handled entirely server-side — kept out of this formal
  # parameter list for the same reason routes/tradingStructure.ts's own
  # Sprint 40 path is: Orval's zod+split-types generator produces a genuine
  # duplicate-export collision when a path param and a query param are
  # documented together on the same operation.
  /trading/liquidity/{symbol}:
    get:
      operationId: getTradingLiquidity
      tags: [trading-liquidity]
      summary: Liquidity / Order Flow analysis for a symbol — volume profile, dollar-volume liquidity score, and a buy/sell pressure proxy derived from the candle series' own up/down closes, SIMULATED-first, honestly labelled dataSource
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liquidity analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingLiquidityAnalysis"
        "404":
          description: Unknown or invalid symbol
        "400":
          description: Invalid interval or lookback query override

  # ─── AI Trade Coach (Engine 2, Phase 3 Sprint 47) ───────────────────────────
  # SSE variant at /trading/coach/ask/stream is not modeled here, matching
  # /stock-analyst/value-research/ask's own precedent — orval only models
  # single-shot JSON responses.
  /trading/coach/ask:
    post:
      operationId: askTradingCoach
      tags: [trading-coach]
      summary: Ask a free-form question about a symbol, grounded in Structure/Multi-Timeframe/Liquidity/Regime/Probability, the calling user's own portfolio Risk analysis, and recent Trading Journal reflections (read-only; never executes; SSE variant at /trading/coach/ask/stream is not modeled here)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingCoachAskInput"
      responses:
        "200":
          description: Grounded answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingCoachAskResult"
        "404":
          description: Unknown or invalid symbol

  # ─── Backtesting (Engine 2, Phase 3 Sprint 49) ──────────────────────────────
  /trading/backtest/run:
    post:
      operationId: runTradingBacktest
      tags: [trading-backtest]
      summary: Run a genuine walk-forward price-action backtest for a symbol against a named strategy, persisting the result to the calling user's own history (read-only over historical candles; never places an order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingRunBacktestInput"
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingBacktestResult"
        "404":
          description: Unknown or invalid symbol

  /trading/backtest/results:
    get:
      operationId: listTradingBacktestResults
      tags: [trading-backtest]
      summary: List the calling user's own persisted backtest results, newest first
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradingBacktestResult"

  # ─── Options Engine-Native Backtesting (Phase 4, Sprint 58 — Route + UI,
  # conditional on Sprint 57's own Core output proving valuable). A genuine
  # bar-by-bar walk-forward simulation, distinct from the legacy
  # /backtest/run's fabricated-statistics generator (unmodified, left in
  # place as a parallel legacy path) — reuses Engine 2's MarketDataProvider
  # for the underlying spot price path and optionsMath.ts's own
  # getSnapshot() for IV, composed in lib/optionsBacktest.ts.
  /options-backtest/run:
    post:
      operationId: runOptionsBacktest
      tags: [options-backtest]
      summary: Run a genuine walk-forward options-strategy backtest for a symbol, persisting the result to the calling user's own history (read-only over historical candles and deterministic options pricing; never places an order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionsRunBacktestInput"
      responses:
        "200":
          description: Backtest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionsBacktestResult"
        "404":
          description: Unknown or invalid symbol

  /options-backtest/results:
    get:
      operationId: listOptionsBacktestResults
      tags: [options-backtest]
      summary: List the calling user's own persisted options backtest results, newest first
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OptionsBacktestResult"

components:
  schemas:
    # ─── Value Investing (Buffett-style; all SIMULATED, advisory only) ────────────
    ValueFactorScore:
      type: object
      required: [label, score, detail]
      properties:
        label: { type: string }
        score: { type: number }
        detail: { type: string }

    ValueBusinessQuality:
      type: object
      required: [score, rating, factors, summary]
      properties:
        score: { type: number }
        rating:
          type: string
          enum: [Wonderful, Good, Average, Weak]
        factors:
          type: array
          items: { $ref: "#/components/schemas/ValueFactorScore" }
        summary: { type: string }

    ValueMoatSource:
      type: object
      required: [source, strength]
      properties:
        source: { type: string }
        strength: { type: number }

    ValueMoatAnalysis:
      type: object
      required: [rating, score, durabilityYears, sources, summary]
      properties:
        rating:
          type: string
          enum: [Wide, Medium, Narrow, None]
        score: { type: number }
        durabilityYears: { type: number }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ValueMoatSource" }
        summary: { type: string }

    ValueCompetitiveDimensionScore:
      type: object
      required: [dimension, score, weight, detail]
      properties:
        dimension: { type: string }
        score: { type: number, nullable: true }
        weight: { type: number }
        detail: { type: string }
        reason: { type: string }

    ValueCompetitiveAdvantageAnalysis:
      type: object
      required: [score, dimensions, classification, strengths, weaknesses, confidenceLevel, confidenceExplanation, summary]
      properties:
        score: { type: number, nullable: true }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/ValueCompetitiveDimensionScore" }
        classification:
          type: string
          enum: [Wide, Medium, Narrow, None]
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        confidenceLevel:
          type: string
          enum: [High, Moderate, Low]
        confidenceExplanation: { type: string }
        summary: { type: string }

    ValueFinancialStrength:
      type: object
      required: [rating, score, metrics, flags, summary]
      properties:
        rating:
          type: string
          enum: [Strong, Acceptable, Weak, Risky]
        score: { type: number }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ValueFactorScore" }
        flags:
          type: array
          items: { type: string }
        summary: { type: string }

    ValueFairValueMethod:
      type: object
      required: [method, fairValue, detail]
      properties:
        method: { type: string }
        fairValue: { type: number }
        detail: { type: string }

    ValueValuation:
      type: object
      required: [available, dataSource, price, summary]
      properties:
        available: { type: boolean }
        dataSource: { type: string }
        price: { type: number }
        summary: { type: string }
        fairValue: { type: number }
        fairValueLow: { type: number }
        fairValueHigh: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        reason: { type: string }

    ValueGrahamValuation:
      type: object
      required: [available, price, summary]
      properties:
        available: { type: boolean }
        price: { type: number }
        summary: { type: string }
        grahamNumber: { type: ["number", "null"] }
        growthFormulaValue: { type: ["number", "null"] }
        fairValue: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        reason: { type: string }

    ValueDcfValuation:
      type: object
      required: [available, price, discountRate, terminalGrowthRate, summary]
      properties:
        available: { type: boolean }
        price: { type: number }
        discountRate: { type: number }
        terminalGrowthRate: { type: number }
        summary: { type: string }
        projectionYears: { type: number }
        projectedFreeCashFlows:
          type: array
          items: { type: number }
        terminalValue: { type: number }
        fairValue: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        confidenceLabel:
          type: string
          enum: [High, Moderate, Low]
        confidenceExplanation: { type: string }
        reason: { type: string }

    ValueBuffettValuation:
      type: object
      required: [available, price, requiredReturn, summary]
      properties:
        available: { type: boolean }
        price: { type: number }
        requiredReturn: { type: number }
        summary: { type: string }
        ownerEarnings: { type: number }
        fairValue: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        reason: { type: string }

    ValueQualityMetricScore:
      type: object
      required: [metric, availability, weight, detail]
      properties:
        metric: { type: string }
        availability:
          type: string
          enum: [available, unavailable]
        score: { type: ["number", "null"] }
        weight: { type: number }
        detail: { type: string }
        reason: { type: string }

    ValueInvestmentQuality:
      type: object
      required: [metrics, strengths, weaknesses, confidenceLevel, confidenceExplanation, summary]
      properties:
        score: { type: ["number", "null"] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ValueQualityMetricScore" }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        confidenceLevel:
          type: string
          enum: [High, Moderate, Low]
        confidenceExplanation: { type: string }
        summary: { type: string }

    ValueModelFairValue:
      type: object
      required: [model, fairValue]
      properties:
        model: { type: string }
        fairValue: { type: number }

    ValueConsolidatedMarginOfSafety:
      type: object
      required: [price, modelsConsidered, modelsAvailable, fairValues, agreement, summary]
      properties:
        price: { type: number }
        modelsConsidered: { type: number }
        modelsAvailable: { type: number }
        fairValues:
          type: array
          items: { $ref: "#/components/schemas/ValueModelFairValue" }
        minFairValue: { type: ["number", "null"] }
        maxFairValue: { type: ["number", "null"] }
        averageFairValue: { type: ["number", "null"] }
        averageMarginOfSafety: { type: ["number", "null"] }
        agreement:
          type: string
          enum: [unanimous, majority, split, insufficient-data]
        summary: { type: string }

    ValueTomNashPillarScore:
      type: object
      required: [label, detail]
      properties:
        label: { type: string }
        score: { type: ["number", "null"] }
        detail: { type: string }

    ValueSectorMacroContext:
      type: object
      required: [sector, industry, macroRegime, macroRegimeLabel, detail]
      properties:
        sector: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        macroRegime:
          type: string
          enum: [rising_rates, falling_rates, stable_rates]
        macroRegimeLabel: { type: string }
        detail: { type: string }

    ValueRateSensitivityAnalysis:
      type: object
      required: [durationScore, classification, sensitivityLabel, detail]
      properties:
        durationScore: { type: number }
        classification:
          type: string
          enum: ["Long-Duration Growth", "Value / Short-Duration", Blend]
        sensitivityLabel: { type: string }
        detail: { type: string }

    ValueAiTechCycleAnalysis:
      type: object
      required: [score, label, detail]
      properties:
        score: { type: number }
        label:
          type: string
          enum: [High, Moderate, Low]
        detail: { type: string }

    ValueTomNashAnalysis:
      type: object
