openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DK Option Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: monitoring
    description: Operational monitoring — background-job health, database connectivity, request-error rate, and audit-log-derived alerting signals (Phase 6, Sprint 74)
  - name: scanner
    description: Daily options scanner
  - name: options
    description: Option chain data
  - name: portfolio
    description: Portfolio positions and Greeks
  - name: trades
    description: Trade management
  - name: backtest
    description: Strategy backtesting
  - name: scoring
    description: Ravish Score AI ranking
  - name: journal
    description: Trade journal
  - name: ai
    description: AI Options Assistant
  - name: settings
    description: User settings
  - name: performance
    description: Performance analytics
  - name: value
    description: Buffett-style value-investing research & education (SIMULATED, advisory only)
  - name: portfolio-construction
    description: Target-allocation portfolio construction for value investing (advisory/education only, never places an order — distinct from the options-income "portfolio" tag)
  - name: trading-journal
    description: Trading journal for Engine 2 (Institutional Trading Engine) positions — mirrors the options "journal" tag's shape, distinct table/records, advisory only, never places an order
  - name: trading-structure
    description: Engine 2 Market Structure analysis (support/resistance zones, trend classification) — SIMULATED-first, advisory only, never places an order
  - name: trading-multi-timeframe
    description: Engine 2 Multi-Timeframe trend confluence analysis — composes Market Structure across multiple timeframes, SIMULATED-first, advisory only, never places an order
  - name: trading-regime
    description: Engine 2 Market Regime analysis — composes trend (Multi-Timeframe), liquidity, and realized-volatility axes into a single regime read, SIMULATED-first, advisory only, never places an order
  - name: trading-probability
    description: Engine 2 Probability analysis — a driftless lognormal probability cone (±1σ/±2σ) and honest availability, composed on Market Regime's own resolved price/volatility, SIMULATED-first, advisory only, never places an order
  - name: trading-positions
    description: Engine 2 trading position ledger (open/closed positions, entry/stop/target) — instrument-agnostic, distinct from the options-income "trades" table, advisory only, never places an order
  - name: trading-risk
    description: Engine 2 portfolio risk analysis (position sizing, stop/target discipline, portfolio risk budget) over the calling user's own trading_positions, composed on Market Regime's own resolved price/volatility for touch-probability context, SIMULATED-first, advisory only, never places an order
  - name: trading-liquidity
    description: Engine 2 Liquidity / Order Flow analysis (volume profile, dollar-volume liquidity score, buy/sell pressure proxy) — a sibling engine to Market Structure, not built on top of it, SIMULATED-first, advisory only, never places an order
  - name: trading-coach
    description: Engine 2 AI Trade Coach — free-form Q&A grounded in Structure/Multi-Timeframe/Liquidity/Regime/Probability, the calling user's own portfolio Risk analysis, and recent Trading Journal reflections, SIMULATED-first, educational only, never places an order
  - name: trading-backtest
    description: Engine 2 Backtesting — a genuine walk-forward price-action backtest replaying SIMULATED candles through a named entry/exit rule set (trend-following, mean-reversion, structure-breakout), producing a real trade log and equity curve, SIMULATED-first, advisory only, never places an order
  - name: trading-trade-plans
    description: Institutional Trade Workspace (Phase 25) — real persistence for a human-authored pre-trade plan (direction, thesis, entry/stop/target, derived position size and risk/reward), advisory only, never places an order
  - name: trading-workspace-notes
    description: Institutional Trade Workspace (Phase 25) — lightweight per-symbol free-text notes, distinct from the deeper structured Trading Journal
  - name: trading-strategies
    description: Institutional Strategy Framework (Phase 30) — user-authored Strategy Metadata (name, description, category, timeframes, markets, required evidence, a checklist template, educational notes, references, version) and Checklist Engine instances. Architecture/framework only — no named methodology (ICT/SMC/ASAD/Trader Bill/Tom Nash/Dunni Framework) is implemented, and no trading signal is ever generated.
  - name: trading-session
    description: Institutional Trade Workspace (Phase 25) — which named trading sessions are currently open plus today's realized session high/low, descriptive only, never predictive
  - name: trading-analytics
    description: Institutional Trading Analytics Engine (Phase 32) — deterministic aggregation of already-persisted Trading Engine data (trades reviewed, plans, journal entries, strategy usage, checklist completion, learning progress, coach usage, session activity). Pure reporting/analytics — no signals, no predictions, no automated execution.
  - name: investing-analytics
    description: Institutional Investing Analytics Engine (Phase 33) — deterministic aggregation of already-persisted Investing Engine data (portfolios, holdings, research notes, watchlist, saved Investment Committee decision snapshots, saved risk snapshots, saved optimisation reviews, saved screener criteria, AI Coach usage). Pure reporting/analytics — no signals, no predictions, no automated execution.
  - name: executive-intelligence
    description: Institutional Executive Intelligence & Reporting Hub (Phase 33) — unifies the Investing Engine's and Trading Engine's own analytics into a single executive view (overview, per-engine summaries, cross-engine risk/learning/coach rollups, a Reporting Centre tally, and a chronological Activity Timeline). Pure composition over already-persisted, already-computed data — no new scoring, no signal, no forecast, no AI prediction, no automated execution.
  - name: cross-engine-workspace
    description: Cross-Engine Orchestration & Unified Workspace (Phase 34) — one workspace spanning the Investing and Trading engines, with a chronological Activity Timeline extended with Trade Plan/Strategy/Learning entries, Cross-Engine Recent Items (most-recently-touched per category), Cross-Engine Tasks (already-flagged "needs attention" counts), and a deterministic Global Search over 9 already-persisted entity categories. Pure orchestration/aggregation/search over already-persisted data — no semantic search, no new scoring, no signal, no forecast, no AI prediction, no automated execution.
  - name: options-income
    description: Institutional Options Income Engine — Foundation (Phase 35) — deterministic aggregation and a Position Model view over the existing, mature Options Income Engine's own `trades` table (Income Overview, Strategy Mix, Upcoming Expirations, per-position Underlying/Strategy/Expiration/Premium/Collateral/Greeks/Status/Lifecycle/Notes), plus a static 9-strategy Strategy Library template catalog. Architecture-only foundation — no live brokerage execution, no auto trading, no auto adjustments, no AI predictions, no direction forecasting, no position recommendations, no trade alerts, no market timing.
  - name: options-lifecycle
    description: Institutional Position Lifecycle Manager (Phase 36) — deterministic lifecycle-stage tracking (Draft/Planned/Open/Monitoring/Near Expiration/Assignment Risk/Closed/Archived, no automatic transitions), an append-only event log backing the Position Timeline/Position History/Adjustment Journal/Assignment Tracker, per-position institutional checklists for the 9 Strategy Library strategies, a review-schedule assignment (Daily/Weekly/Monthly/Expiration/Manual, no reminders or notifications), and a portfolio management view (position concentration, strategy/sector allocation, expiration ladder, capital utilisation, buying power allocation, income allocation) reused directly from the existing Portfolio Risk Dashboard and Options Income Engine. Deterministic workflow tooling only — no live brokerage execution, no auto trading, no auto adjustments, no AI predictions, no direction forecasting, no position recommendations, no trade alerts, no automated rolling, no automated assignment handling.
  - name: broker
    description: Read-only Alpaca Paper Trading broker/account verification (account balances, open positions, open orders, connection health) — Paper Trading endpoint only, never places, modifies, or cancels an order
  - name: risk-exposure
    description: Institutional Risk & Exposure Intelligence Engine (Phase 37) — a deterministic cross-platform dashboard unifying Investing, Trading, and Options risk (per-engine views plus a Combined view — capital allocation, buying power, sector/strategy concentration, asset allocation, Greeks summary, a disclosed non-fabricated cross-engine symbol-overlap Correlation Overview, and a real Concentration Timeline from saved risk snapshots and Options exposure history). Every figure is reused directly from an existing, already-tested engine (lib/investingRisk.ts, lib/portfolioConstruction.ts, lib/tradingRisk.ts, lib/portfolioDashboard.ts, lib/optionsPortfolioManagement.ts) or a thin, pure aggregation over them. Analytics and visibility only — no live execution, no auto hedging, no auto rebalancing, no trade/position recommendations, no AI predictions, no probability forecasting, no AI-based risk scoring, no automated alerts.
  - name: performance-attribution
    description: Institutional Performance & Attribution Engine (Phase 38) — a deterministic cross-platform dashboard explaining Investing, Trading, and Options performance (per-engine views plus a Combined view — return by engine, sector/strategy/asset attribution, risk-adjusted performance, capital efficiency, and a real Historical Performance Timeline from monthly realized P&L and saved Investing portfolio snapshots). Every figure is reused directly from an existing, already-tested engine (lib/portfolioConstruction.ts, lib/optionsIncomeAnalytics.ts) or computed from real, already-persisted columns (trading_positions'/trades' own entry/exit price and P&L fields) using the exact Sharpe-ratio formula shape lib/tradingBacktest.ts already established. Analytical only — no AI predictions, no forecasts, no trade recommendations, no portfolio optimisation, no auto rebalancing, no auto execution, no alpha generation, no benchmark prediction.
  - name: scenario-engine
    description: Institutional Scenario & Stress Testing Engine (Phase 39) — a deterministic dashboard evaluating hypothetical market moves (Market ±5%/±10%, Volatility Increase/Decrease, Interest Rate Increase/Decrease, custom percentage move) across Investing, Trading, and Options portfolios. Options scenarios reuse lib/portfolioStressTest.ts's own already-shipped What-If simulator verbatim for price/volatility shocks, plus a new interest-rate scenario supplying a shocked rate to optionsMath.ts's own already-exported bs() parameter. Investing/Trading use a linear equity repricing formula; volatility/rate scenarios are honestly unavailable for those two engines (no IV/Greeks formalism for a raw equity position). Analytical only — no AI predictions, no market forecasting, no price targets, no trade recommendations, no portfolio optimisation, no auto hedging, no auto execution, no Monte Carlo simulation, no random scenario generation.
  - name: decision-support-engine
    description: Institutional Decision Support & Executive Insights Engine (Phase 40) — a deterministic executive workspace consolidating Risk & Exposure (Phase 37), Performance & Attribution (Phase 38), Scenario & Stress Testing (Phase 39), and Portfolio Concentration into one Executive Summary, Portfolio Health Overview, Risk/Performance/Scenario/Capital Allocation/Exposure/Diversification Summary, deterministic Executive Alerts, Outstanding Issues, Key Metrics Dashboard, and an 11-dimension Executive Health scorecard. Every figure is reused directly from an existing, already-tested engine or a thin, named-threshold aggregation over them — Investing/Trading/Options figures are always kept side by side, never blended into a fabricated composite. Interpretation only — no AI predictions, no trade recommendations, no buy/sell signals, no portfolio optimisation, no auto execution, no auto hedging, no auto rebalancing, no market forecasting, no machine learning, no generative investment advice.
  - name: rebalancing-engine
    description: Institutional Portfolio Rebalancing & Allocation Planning Engine (Phase 41) — deterministic Current vs. Target Allocation and Allocation Drift per Investing portfolio (reused verbatim from Portfolio Construction, Phase 2 Sprint 28), cross-engine Sector/Asset/Strategy/Capital Allocation and an Allocation Timeline (reused verbatim from the Risk & Exposure Engine, Phase 37), and a Rebalancing Planner comparing current allocation against a caller-supplied set of proposed target weights, including the dollar capital movement required to close each drift. Planning and analysis only — no trade recommendations, no buy/sell signals, no automatic portfolio optimisation, no automatic rebalancing, no auto execution, no AI predictions, no forecasting, no machine learning, no broker integration changes. Trading/Options positions honestly carry no target-weight concept in this codebase and are never approximated.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Monitoring (Phase 6, Sprint 74) ────────────────────────────────────
  /monitoring/status:
    get:
      operationId: getMonitoringStatus
      tags: [monitoring]
      summary: Operational health status — database, background jobs, request-error rate, and active alerts
      responses:
        "200":
          description: Current monitoring status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringStatus"

  /ops/market-data-validation:
    get:
      operationId: getMarketDataValidation
      tags: [ops]
      summary: Administrator-only cross-provider live market data validation report
      description: >-
        Consolidates the Options Engine's provider selection, Engine 1's
        per-provider fundamentals status, Engine 2's market data provider,
        and the US market clock/calendar into one report — staleness and
        missing-data are flagged in the context of whether the market is
        actually open right now. Requires the "admin" role.
      responses:
        "200":
          description: Live market data validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveMarketValidationReport"
        "401":
          description: Not authenticated
        "403":
          description: Authenticated but not an administrator

  # ─── Scanner ───────────────────────────────────────────────────────────────
  /scanner/results:
    get:
      operationId: getScannerResults
      tags: [scanner]
      summary: Get latest scanner results
      parameters:
        - name: strategy
          in: query
          schema:
            type: string
            enum: [iron_condor, iron_fly, calendar_spread, earnings]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Scanner results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerResult"

  /scanner/run:
    post:
      operationId: runScanner
      tags: [scanner]
      summary: Trigger a new scanner run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerRunInput"
      responses:
        "200":
          description: Scanner started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerRunResponse"

  /scanner/top:
    get:
      operationId: getTopOpportunities
      tags: [scanner]
      summary: Get top-ranked trade opportunities across all strategies
      responses:
        "200":
          description: Top opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopOpportunities"

  /scanner/earnings:
    get:
      operationId: getEarningsScan
      tags: [scanner]
      summary: Scan for near-term earnings with elevated IV and recommended structures
      responses:
        "200":
          description: Earnings plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EarningsPlay"

  /events:
    get:
      operationId: getUpcomingEvents
      tags: [scanner]
      summary: Upcoming economic / market event calendar (earnings, FOMC, CPI, jobs, dividends)
      parameters:
        - name: horizonDays
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Upcoming events sorted by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRiskEvent"

  /market-data/health:
    get:
      operationId: getMarketDataHealth
      tags: [scanner]
      summary: Get options market-data provider status and last-scan health metrics
      responses:
        "200":
          description: Market data health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataHealth"

  # ─── Broker (Alpaca Paper Trading, read-only) ──────────────────────────────
  /broker/health:
    get:
      operationId: getBrokerHealth
      tags: [broker]
      summary: Get Alpaca Paper Trading broker connection/account health (read-only)
      description: >-
        Performs a live, authenticated read-only round trip to Alpaca's Paper
        Trading API (GET /v2/account, /v2/positions, /v2/orders) and reports
        connection status, account balances, and open position/order counts.
        Never places, modifies, or cancels an order. Always targets Alpaca's
        Paper Trading endpoint — there is no live-trading equivalent.
      responses:
        "200":
          description: Broker health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerHealth"

  /broker/orders:
    get:
      operationId: getBrokerOrders
      tags: [broker]
      summary: List all Alpaca Paper Trading orders (any status), read-only
      description: >-
        A thin, read-only pass-through to GET /v2/orders?status=all. Never
        places, modifies, or cancels an order. Bounded to Alpaca's own
        default page size (no further pagination this sprint).
      responses:
        "200":
          description: Broker orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerOrdersResult"

  /broker/orders/{orderId}:
    get:
      operationId: getBrokerOrder
      tags: [broker]
      summary: Get a single Alpaca Paper Trading order by id, read-only
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Broker order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerOrderResult"

  /broker/positions:
    get:
      operationId: getBrokerPositions
      tags: [broker]
      summary: List all Alpaca Paper Trading positions, read-only
      description: >-
        A thin, read-only pass-through to GET /v2/positions. Distinct from
        GET /broker/reconciliation's own positions array, which is a
        local-vs-broker comparison, not a plain display list — this route
        surfaces Alpaca's own position fields (average entry price, side,
        market value, unrealized P/L) directly. Never modifies or closes a
        position.
      responses:
        "200":
          description: Broker positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerPositionsResult"

  /broker/reconciliation:
    get:
      operationId: getBrokerReconciliation
      tags: [broker]
      summary: Compare local trade/order records against Alpaca Paper Trading orders and positions, read-only
      description: >-
        Manual, on-demand only — never runs on a schedule or background
        timer. Read-only: identifies discrepancies (missing at broker,
        missing locally, status/quantity/symbol mismatches, open-position
        mismatches) without correcting, cancelling, or closing anything on
        either side.
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationResult"

  /broker/reconciliation/reports:
    get:
      operationId: listReconciliationReports
      tags: [broker]
      summary: List the calling user's own persisted reconciliation report history, newest first
      responses:
        "200":
          description: Reconciliation report history
          content:
            application/json:
              schema:
                type: object
                required: [reports]
                properties:
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReconciliationReportSummary"
    post:
      operationId: createReconciliationReport
      tags: [broker]
      summary: Run a fresh reconciliation and persist a snapshot of it — explicit trigger only, never on a schedule
      responses:
        "201":
          description: The newly-persisted reconciliation report summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReportSummary"

  /broker/reconciliation/reports/{id}:
    get:
      operationId: getReconciliationReport
      tags: [broker]
      summary: Get one persisted reconciliation report's full detail, by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reconciliation report detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReportDetail"
        "404":
          description: No such report, or it does not belong to the calling user

  # ─── Options Chain ─────────────────────────────────────────────────────────
  /options/chain/{symbol}:
    get:
      operationId: getOptionChain
      tags: [options]
      summary: Get live option chain for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Option chain data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionChain"

  /options/universe:
    get:
      operationId: getUniverse
      tags: [options]
      summary: Get the list of tracked symbols with market data
      responses:
        "200":
          description: Universe symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniverseSymbol"

  /options/expirations/{symbol}:
    get:
      operationId: getExpirations
      tags: [options]
      summary: Get available expiration dates for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expiration dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpirationDate"

  # ─── Portfolio ──────────────────────────────────────────────────────────────
  /portfolio/positions:
    get:
      operationId: getPortfolioPositions
      tags: [portfolio]
      summary: Get live Alpaca positions
      responses:
        "200":
          description: Portfolio positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /portfolio/greeks:
    get:
      operationId: getPortfolioGreeks
      tags: [portfolio]
      summary: Get aggregate portfolio Greeks
      responses:
        "200":
          description: Portfolio Greeks summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioGreeks"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio account summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/risk:
    get:
      operationId: getRiskStatus
      tags: [portfolio]
      summary: Get portfolio risk status and limit compliance
      responses:
        "200":
          description: Risk status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskStatus"

  /portfolio/theta:
    get:
      operationId: getThetaIncome
      tags: [portfolio]
      summary: Get theta income across horizons with symbol/strategy breakdowns
      responses:
        "200":
          description: Theta income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThetaIncome"

  # ─── Trades ─────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all trades
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, pending]
        - name: strategy
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Create and execute a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Trade created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
    delete:
      operationId: closeTrade
      tags: [trades]
      summary: Close / exit a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/adjustments:
    get:
      operationId: listTradeAdjustments
      tags: [trades]
      summary: Adjustment recommendations for every open trade
      responses:
        "200":
          description: One recommendation per open position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeAdjustment"

  /trades/{id}/adjustment:
    get:
      operationId: getTradeAdjustment
      tags: [trades]
      summary: Adjustment recommendation for a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Adjustment recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeAdjustment"

  /trades/{id}/monitor:
    get:
      operationId: getTradeMonitor
      tags: [trades]
      summary: Get real-time monitoring data for an open trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade monitoring data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeMonitor"

  # ─── Execution (Phase 5: semi-automatic) ────────────────────────────────────
  /execution/preview:
    post:
      operationId: previewExecution
      tags: [execution]
      summary: Build option order legs, compute metrics, and run pre-trade risk validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionPreviewInput"
      responses:
        "200":
          description: Execution ticket with order legs, metrics, and validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionTicket"

  /execution/submit:
    post:
      operationId: submitExecution
      tags: [execution]
      summary: Submit a validated multi-leg order through the broker (semi-auto only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionSubmitInput"
      responses:
        "201":
          description: Order submitted; pending trade and journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSubmitResult"

  /execution/adjustment/preview:
    post:
      operationId: previewAdjustmentExecution
      tags: [execution]
      summary: Build a ready-to-submit roll/convert ticket for an open position's recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentPreviewInput"
      responses:
        "200":
