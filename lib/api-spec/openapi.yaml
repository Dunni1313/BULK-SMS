          type: string
        symbol:
          type: string
        side:
          type: string
        qty:
          type: number
        type:
          type: string
        status:
          type: string
          description: Alpaca's own raw status string, unmodified.
        normalizedStatus:
          $ref: "#/components/schemas/NormalizedOrderStatus"
        filledQty:
          type: number
        filledAvgPrice:
          type: ["number", "null"]
        submittedAt:
          type: ["string", "null"]

    BrokerOrdersResult:
      type: object
      required: [available, unavailableReason, orders, checkedAt]
      properties:
        available:
          type: boolean
        unavailableReason:
          type: ["string", "null"]
        orders:
