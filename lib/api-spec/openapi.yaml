          description: Timestamp of the most recent check that authenticated successfully — never updated by a failed check, so a broken connection never appears "recently successful."
        reason:
          type: string
          description: Human-readable explanation of the current status (never connected/not connected/authentication failed).
        checkedAt:
          type: string
          description: Timestamp of this specific check.

