        capitalAllocationReview:
          $ref: "#/components/schemas/MentorCapitalAllocationReview"
        riskReview:
          $ref: "#/components/schemas/MentorRiskReview"
        incomeReview:
          $ref: "#/components/schemas/MentorIncomeReview"
        behaviourReview:
          $ref: "#/components/schemas/MentorBehaviourReview"
