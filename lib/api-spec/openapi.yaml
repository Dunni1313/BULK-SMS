    # ─── Settings ──────────────────────────────────────────────────────────────
    Settings:
      type: object
      required: [executionMode, maxRiskPerTrade, maxPortfolioRisk, profitTarget50, profitTarget75, profitTarget90, stopLossMultiplier, alpacaConnected]
      properties:
        executionMode:
          type: string
          enum: [manual, semi_auto, full_auto]
        maxRiskPerTrade:
          type: number
          description: Max risk per trade as percentage of account (default 1%)
        maxPortfolioRisk:
          type: number
          description: Max portfolio risk as percentage (default 10%)
        profitTarget50:
          type: number
        profitTarget75:
          type: number
        profitTarget90:
          type: number
        stopLossMultiplier:
          type: number
          description: Stop loss as multiple of credit received (default 2x)
        alpacaConnected:
          type: boolean
        alpacaApiKey:
          type: ["string", "null"]
        scannerMode:
          type: string
          enum: [mock, live]
          description: Scanner data mode — mock (simulated) or live (provider chains)
        marketDataProvider:
          type: string
          enum: [mock, alpaca, polygon]
          description: Preferred options-data provider when in live mode
        defaultDte:
          type: integer
          description: Default days to expiry (default 45)
        shortDelta:
          type: number
          description: Default short delta (default 0.20)
        minIvRank:
          type: number
          description: Minimum IV rank to consider trades
        autoExecuteEnabled:
          type: boolean
          description: Full-auto master switch / kill switch (default false)
        autoMaxTradesPerDay:
          type: integer
        autoMaxConcurrentPositions:
          type: integer
        autoMinRavishScore:
          type: number
        autoMaxDailyLossPct:
          type: number
        autoQuantityPerTrade:
          type: integer
        adjDeltaDriftTrigger:
          type: number
          description: Net |delta| at which a position is flagged for adjustment
        adjPopDropTrigger:
          type: number
          description: POP drop (points vs entry) that flags a position
        adjShortStrikeProximityPct:
          type: number
          description: Spot-to-short-strike distance (%) considered "tested"
        adjIvExpansionTrigger:
          type: number
          description: IV expansion (% vs entry IV) that flags a position
        adjDteTrigger:
          type: integer
          description: DTE at/under which gamma-management kicks in
        autoAdjustEnabled:
          type: boolean
          description: Auto-adjustment master switch (close/de-risk only)
        eventRiskEnabled:
          type: boolean
          description: Event Risk Filter master switch
        eventRiskBlockEarningsShortPremium:
          type: boolean
          description: Block opening short-premium trades before earnings
        eventRiskAutoBlockHigh:
          type: boolean
          description: Block AutoPilot auto-execution when event risk is high
        fundamentalsProvider:
          type: string
          enum: [simulated, alpha_vantage, financial_modeling_prep]
          description: Value-investing fundamentals provider (only "simulated" is wired today)
        fundamentalsConnected:
          type: boolean
          description: Whether a live fundamentals provider is configured (always false today)
        fundamentalsLastFetchedAt:
          type: ["string", "null"]
          description: ISO timestamp of the most recent successful live fundamentals fetch (null if a live provider has never been reached this process)
        fundamentalsStalenessHours:
          type: integer
          description: How old (in hours) live fundamentals may be before the UI flags them as stale and nudges a refresh (defaults to 24)
        fundamentalsAutoRefresh:
          type: boolean
          description: Auto re-fetch live fundamentals once data crosses the staleness threshold (no effect for simulated data)
        investingRiskFreeRate:
          type: number
          description: Risk-free rate assumption for the Investing Engine's valuation models (default 0.045, matches the options engine's RISK_FREE constant)
        investingDefaultDiscountRate:
          type: number
          description: Default discount-rate assumption for the Investing Engine's DCF/Buffett valuation models (default 0.09)
        investingFilingsProvider:
          type: string
          description: Filings data source for Annual Report Analysis (only "edgar" is wired today)

    FundamentalsProviderStatus:
      type: object
      required: [provider, label, selected, keyPresent, state, message]
      properties:
        provider:
          type: string
          description: Live provider id (financial_modeling_prep, alpha_vantage)
        label:
          type: string
          description: Human-readable provider name
        selected:
          type: boolean
          description: Whether this provider is the one selected in Settings
        keyPresent:
          type: boolean
          description: Whether the provider's API key is configured in the environment
        state:
          type: string
          enum: [ok, rate_limited, unreachable, no_data, not_configured, idle]
          description: >-
            Derived health. ok = responding; rate_limited = temporary, recovers
            on its own; unreachable = misconfigured/down; no_data = key works but
            no data; not_configured = no API key; idle = configured, not yet queried
        message:
          type: string
          description: Operator-facing explanation of the current state
        lastSuccessAt:
          type: ["string", "null"]
          description: ISO timestamp of the most recent successful live fetch
        lastFallbackAt:
          type: ["string", "null"]
          description: ISO timestamp of the most recent fallback to simulated data
        lastFallbackReason:
          type: ["string", "null"]
          enum: [rate_limit, error, no_data, null]
