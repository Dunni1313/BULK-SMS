        financialStrengthScore: { type: number }
        valuationRating: { type: string, enum: [Cheap, Fair, Expensive, "Very Expensive", Unavailable] }
        marginOfSafety: { type: ["number", "null"] }
        marketCap: { type: ["number", "null"] }
        revenueGrowth5y: { type: number }
        roic: { type: number }
        roe: { type: number }
        debtToEquity: { type: number }
        fcfMargin: { type: number }
        dividendYield: { type: number }
        investmentCommitteeVerdict: { type: string, enum: [Buy, Hold, Wait] }
        investmentCommitteeConfidence: { type: number }
        tomNashConvictionScore: { type: number }
        tomNashVerdict: { type: string, enum: [Buy, Hold, Wait] }
        decisionRecommendation: { type: string, enum: [Buy, Accumulate, Hold, Reduce, Sell, Avoid] }
