openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DK Option Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scanner
    description: Daily options scanner
  - name: options
    description: Option chain data
  - name: portfolio
    description: Portfolio positions and Greeks
  - name: trades
    description: Trade management
  - name: backtest
    description: Strategy backtesting
  - name: scoring
    description: Ravish Score AI ranking
  - name: journal
    description: Trade journal
  - name: ai
    description: AI Options Assistant
  - name: settings
    description: User settings
  - name: performance
    description: Performance analytics
  - name: value
    description: Buffett-style value-investing research & education (SIMULATED, advisory only)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Scanner ───────────────────────────────────────────────────────────────
  /scanner/results:
    get:
      operationId: getScannerResults
      tags: [scanner]
      summary: Get latest scanner results
      parameters:
        - name: strategy
          in: query
          schema:
            type: string
            enum: [iron_condor, iron_fly, calendar_spread, earnings]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Scanner results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerResult"

  /scanner/run:
    post:
      operationId: runScanner
      tags: [scanner]
      summary: Trigger a new scanner run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerRunInput"
      responses:
        "200":
          description: Scanner started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerRunResponse"

  /scanner/top:
    get:
      operationId: getTopOpportunities
      tags: [scanner]
      summary: Get top-ranked trade opportunities across all strategies
      responses:
        "200":
          description: Top opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopOpportunities"

  /scanner/earnings:
    get:
      operationId: getEarningsScan
      tags: [scanner]
      summary: Scan for near-term earnings with elevated IV and recommended structures
      responses:
        "200":
          description: Earnings plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EarningsPlay"

  /events:
    get:
      operationId: getUpcomingEvents
      tags: [scanner]
      summary: Upcoming economic / market event calendar (earnings, FOMC, CPI, jobs, dividends)
      parameters:
        - name: horizonDays
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Upcoming events sorted by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRiskEvent"

  /market-data/health:
    get:
      operationId: getMarketDataHealth
      tags: [scanner]
      summary: Get options market-data provider status and last-scan health metrics
      responses:
        "200":
          description: Market data health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataHealth"

  # ─── Options Chain ─────────────────────────────────────────────────────────
  /options/chain/{symbol}:
    get:
      operationId: getOptionChain
      tags: [options]
      summary: Get live option chain for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Option chain data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionChain"

  /options/universe:
    get:
      operationId: getUniverse
      tags: [options]
      summary: Get the list of tracked symbols with market data
      responses:
        "200":
          description: Universe symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniverseSymbol"

  /options/expirations/{symbol}:
    get:
      operationId: getExpirations
      tags: [options]
      summary: Get available expiration dates for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expiration dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpirationDate"

  # ─── Portfolio ──────────────────────────────────────────────────────────────
  /portfolio/positions:
    get:
      operationId: getPortfolioPositions
      tags: [portfolio]
      summary: Get live Alpaca positions
      responses:
        "200":
          description: Portfolio positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /portfolio/greeks:
    get:
      operationId: getPortfolioGreeks
      tags: [portfolio]
      summary: Get aggregate portfolio Greeks
      responses:
        "200":
          description: Portfolio Greeks summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioGreeks"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio account summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/risk:
    get:
      operationId: getRiskStatus
      tags: [portfolio]
      summary: Get portfolio risk status and limit compliance
      responses:
        "200":
          description: Risk status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskStatus"

  /portfolio/theta:
    get:
      operationId: getThetaIncome
      tags: [portfolio]
      summary: Get theta income across horizons with symbol/strategy breakdowns
      responses:
        "200":
          description: Theta income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThetaIncome"

  # ─── Trades ─────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all trades
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, pending]
        - name: strategy
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Create and execute a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Trade created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
    delete:
      operationId: closeTrade
      tags: [trades]
      summary: Close / exit a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/adjustments:
    get:
      operationId: listTradeAdjustments
      tags: [trades]
      summary: Adjustment recommendations for every open trade
      responses:
        "200":
          description: One recommendation per open position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeAdjustment"

  /trades/{id}/adjustment:
    get:
      operationId: getTradeAdjustment
      tags: [trades]
      summary: Adjustment recommendation for a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Adjustment recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeAdjustment"

  /trades/{id}/monitor:
    get:
      operationId: getTradeMonitor
      tags: [trades]
      summary: Get real-time monitoring data for an open trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade monitoring data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeMonitor"

  # ─── Execution (Phase 5: semi-automatic) ────────────────────────────────────
  /execution/preview:
    post:
      operationId: previewExecution
      tags: [execution]
      summary: Build option order legs, compute metrics, and run pre-trade risk validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionPreviewInput"
      responses:
        "200":
          description: Execution ticket with order legs, metrics, and validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionTicket"

  /execution/submit:
    post:
      operationId: submitExecution
      tags: [execution]
      summary: Submit a validated multi-leg order through the broker (semi-auto only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionSubmitInput"
      responses:
        "201":
          description: Order submitted; pending trade and journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSubmitResult"

  /execution/adjustment/preview:
    post:
      operationId: previewAdjustmentExecution
      tags: [execution]
      summary: Build a ready-to-submit roll/convert ticket for an open position's recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentPreviewInput"
      responses:
        "200":
          description: Execution ticket for the recommended roll/convert structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionTicket"

  /execution/adjustment/submit:
    post:
      operationId: submitAdjustmentExecution
      tags: [execution]
      summary: Close the source position and open the recommended roll/convert structure (semi-auto only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentSubmitInput"
      responses:
        "201":
          description: Source position closed; rolled/converted trade and journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentSubmitResult"

  # ─── Full-Auto execution (Phase 6) ──────────────────────────────────────────
  /execution/auto/status:
    get:
      operationId: getAutoExecutionStatus
      tags: [execution]
      summary: Current full-auto engine state, guardrails, and today's stats
      responses:
        "200":
          description: Auto-execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoExecutionStatus"

  /execution/auto/log:
    get:
      operationId: getAutoExecutionLog
      tags: [execution]
      summary: Recent full-auto decision audit log
      responses:
        "200":
          description: Audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoExecutionLogEntry"

  /execution/auto/adjust/log:
    get:
      operationId: getAutoAdjustmentLog
      tags: [execution]
      summary: Recent auto-ADJUSTMENT decision audit log (kind=adjust only)
      parameters:
        - name: decision
          in: query
          required: false
          schema:
            type: string
            enum: [executed, skipped, rejected, blocked]
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Adjustment audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoExecutionLogEntry"

  /execution/auto/run:
    post:
      operationId: runAutoExecutionCycle
      tags: [execution]
      summary: Run one full-auto cycle now (no-op unless armed); returns decisions
      responses:
        "200":
          description: Cycle result with per-candidate decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCycleResult"

  /execution/auto/adjust/run:
    post:
      operationId: runAutoAdjustmentCycle
      tags: [execution]
      summary: Run one auto-adjustment cycle now (no-op unless armed); de-risk only
      responses:
        "200":
          description: Adjustment cycle result with per-trade decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAdjustCycleResult"

  # ─── Backtest ────────────────────────────────────────────────────────────────
  /backtest/run:
    post:
      operationId: runBacktest
      tags: [backtest]
      summary: Run a strategy backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestInput"
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /backtest/results:
    get:
      operationId: listBacktestResults
      tags: [backtest]
      summary: List saved backtest results
      responses:
        "200":
          description: Backtest results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BacktestResult"

  # ─── Ravish Score ────────────────────────────────────────────────────────────
  /scoring/{symbol}:
    get:
      operationId: getRavishScore
      tags: [scoring]
      summary: Get Ravish Score for a symbol across all strategies
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ravish Score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RavishScore"

  /scoring/leaderboard:
    get:
      operationId: getScoringLeaderboard
      tags: [scoring]
      summary: Get top-scored opportunities across all symbols
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RavishScore"

  # ─── Journal ─────────────────────────────────────────────────────────────────
  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List journal entries
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal/{id}:
    get:
      operationId: getJournalEntry
      tags: [journal]
      summary: Get a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    patch:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  # ─── AI Assistant ─────────────────────────────────────────────────────────────
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Send a message to the AI options assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswer"

  /ai/messages:
    get:
      operationId: getAiMessages
      tags: [ai]
      summary: Get chat history
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiMessage"

  # ─── AI Trading Coach ─────────────────────────────────────────────────────────
  /coach/explain-trade:
    post:
      operationId: explainTrade
      tags: [coach]
      summary: Explain a scanner candidate or symbol+strategy (read-only, never executes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainTradeInput"
      responses:
        "200":
          description: Deterministic explanation plus narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainTradeResult"

  /coach/teach-greek:
    post:
      operationId: teachGreek
      tags: [coach]
      summary: Tutor one of the four Greeks with a live worked example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeachGreekInput"
      responses:
        "200":
          description: Greek lesson plus narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeachGreekResult"

  /coach/learn/delta:
    get:
      operationId: getDeltaMasterclass
      tags: [coach]
      summary: Delta Masterclass content
      responses:
        "200":
          description: Learn content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnContent"

  /coach/learn/greeks:
    get:
      operationId: getGreeksOverview
      tags: [coach]
      summary: Greeks overview content
      responses:
        "200":
          description: Learn content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnContent"

  /coach/quiz:
    post:
      operationId: generateQuiz
      tags: [coach]
      summary: Generate a Greeks/strategy/risk quiz (answers withheld)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizInput"
      responses:
        "200":
          description: Generated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedQuiz"

  /coach/quiz/grade:
    post:
      operationId: gradeQuiz
      tags: [coach]
      summary: Grade quiz answers server-side and record the attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeQuizInput"
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizGradeResult"

  /coach/quiz/progress:
    get:
      operationId: getQuizProgress
      tags: [coach]
      summary: Recent quiz attempts, best score per topic, and overall stats
      responses:
        "200":
          description: Quiz progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizProgress"

  /coach/journal-review:
    post:
      operationId: journalReview
      tags: [coach]
      summary: Coach a closed trade into a review and a lesson learned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalReviewInput"
      responses:
        "200":
          description: Trade review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalReviewResult"

  /coach/lessons:
    get:
      operationId: getCoachLessons
      tags: [coach]
      summary: Recent saved coaching output
      responses:
        "200":
          description: Saved lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachLesson"

  # ─── Settings ─────────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /fundamentals/provider-status:
    get:
      operationId: getFundamentalsProviderStatus
      tags: [settings]
      summary: Live fundamentals provider status (rate limits / outages)
      description: >-
        Most-recent health for each live fundamentals provider (Financial
        Modeling Prep, Alpha Vantage), so operators can see at a glance when a
        provider is rate-limited or unreachable instead of discovering it one
        symbol at a time.
      responses:
        "200":
          description: Per-provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundamentalsProviderStatusResponse"

  # ─── Performance ──────────────────────────────────────────────────────────────
  /performance/analytics:
    get:
      operationId: getPerformanceAnalytics
      tags: [performance]
      summary: Get performance analytics and metrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1m, 3m, 6m, 1y, all]
            default: "1y"
      responses:
        "200":
          description: Performance analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceAnalytics"

  /performance/equity-curve:
    get:
      operationId: getEquityCurve
      tags: [performance]
      summary: Get equity curve data points
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [1m, 3m, 6m, 1y, all]
            default: "1y"
      responses:
        "200":
          description: Equity curve
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquityPoint"

  /performance/breakdown:
    get:
      operationId: getPerformanceBreakdown
      tags: [performance]
      summary: Get performance metrics broken down by a dimension
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum: [strategy, ticker, duration, delta, ivrank]
        - name: period
          in: query
          schema:
            type: string
            enum: [1m, 3m, 6m, 1y, all]
            default: "all"
      responses:
        "200":
          description: Breakdown buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerformanceBreakdownBucket"

  /portfolio/health:
    get:
      operationId: getPortfolioHealth
      tags: [portfolio]
      summary: Get the deterministic portfolio health score
      responses:
        "200":
          description: Portfolio health, exposure and risk-concentration scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioHealth"

  /briefing:
    get:
      operationId: getMarketBriefing
      tags: [portfolio]
      summary: Get the deterministic daily market briefing with AI narration
      responses:
        "200":
          description: Market briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBriefingResponse"

  /reports:
    get:
      operationId: listDailyReports
      tags: [portfolio]
      summary: List persisted daily reports (newest first)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Daily report history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyReportSummary"
    post:
      operationId: generateDailyReport
      tags: [portfolio]
      summary: Generate and persist a new daily report
      responses:
        "200":
          description: The generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
    delete:
      operationId: clearDailyReports
      tags: [portfolio]
      summary: Delete all persisted daily reports
      responses:
        "200":
          description: Reports cleared (returns the deleted rows so they can be restored)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearReportsResult"

  /reports/restore:
    post:
      operationId: restoreDailyReports
      tags: [portfolio]
      summary: Restore previously cleared daily reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreReportsRequest"
      responses:
        "200":
          description: Reports restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreReportsResult"

  /reports/compare-narration:
    post:
      operationId: narrateReportComparison
      tags: [portfolio]
      summary: AI-narrated plain-English summary of what changed between two reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareReportsRequest"
      responses:
        "200":
          description: Narrated comparison (deltas remain deterministic on the client)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareReportsResponse"
        "400":
          description: Invalid request
        "404":
          description: One or both reports not found

  /reports/{id}:
    get:
      operationId: getDailyReport
      tags: [portfolio]
      summary: Get a single persisted daily report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Daily report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
    delete:
      operationId: deleteDailyReport
      tags: [portfolio]
      summary: Delete a persisted daily report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteReportResult"

  # ─── Value Investing (Buffett-style research & education) ──────────────────────
  /stock-analyst/value-universe:
    get:
      operationId: getValueUniverse
      tags: [value]
      summary: Headline value ratings for all supported symbols (SIMULATED)
      parameters:
        - name: forceRefresh
          in: query
          required: false
          schema: { type: boolean }
          description: Bypass the short-lived live fundamentals cache and pull fresh data
      responses:
        "200":
          description: Value summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValueSummary"

  /stock-analyst/value-research:
    post:
      operationId: generateValueResearch
      tags: [value]
      summary: Generate a value-investing research report with AI thesis (read-only; never executes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueResearchInput"
      responses:
        "200":
          description: Research report plus narrated thesis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueResearchResult"
        "404":
          description: Unknown symbol

  /stock-analyst/value-history:
    get:
      operationId: getValueHistory
      tags: [value]
      summary: List persisted value-research runs
      responses:
        "200":
          description: History rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValueHistoryRow"

  /stock-analyst/value-watchlist:
    get:
      operationId: getValueWatchlist
      tags: [value]
      summary: List value-investing watchlist items
      parameters:
        - name: checkTargets
          in: query
          required: false
          description: When "true", resolves a fresh price per row and computes priceTargetCrossed/marginOfSafetyTargetCrossed (opt-in — a heavier, on-demand check, never automatic).
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: Watchlist
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValueWatchlistItem"
    post:
      operationId: addValueWatchlist
      tags: [value]
      summary: Add a symbol to the value watchlist (advisory only; never places an order)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueWatchlistCreate"
      responses:
        "200":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueWatchlistItem"

  /stock-analyst/value-watchlist/{id}:
    patch:
      operationId: updateValueWatchlist
      tags: [value]
      summary: Update a watchlist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueWatchlistUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueWatchlistItem"
        "404":
          description: Not found
    delete:
      operationId: deleteValueWatchlist
      tags: [value]
      summary: Remove a watchlist item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /stock-analyst/value-school:
    get:
      operationId: getValueLessons
      tags: [value]
      summary: Value Investing School lessons
      responses:
        "200":
          description: Lessons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueLessonsResponse"

  /stock-analyst/value-quiz:
    post:
      operationId: generateValueQuiz
      tags: [value]
      summary: Generate a value-investing quiz (answers withheld)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValueQuizInput"
      responses:
        "200":
          description: Generated quiz
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedValueQuiz"

  /stock-analyst/value-quiz/grade:
    post:
      operationId: gradeValueQuiz
      tags: [value]
      summary: Grade value-quiz answers server-side and record the attempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GradeValueQuizInput"
      responses:
        "200":
          description: Graded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueQuizGradeResult"

  /stock-analyst/value/{symbol}:
    get:
      operationId: getValueReport
      tags: [value]
      summary: Full value-investing research report for a symbol (SIMULATED)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Research report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValueResearchReport"
        "404":
          description: Unknown symbol

  /stock-analyst/financial-statements/{symbol}:
    get:
      operationId: getFinancialStatements
      tags: [value]
      summary: Full multi-year Income Statement / Balance Sheet / Cash Flow Statement for a symbol, fetched on demand
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Financial statements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialStatements"
        "404":
          description: Unknown symbol

  /stock-analyst/industry-comparison/{symbol}:
    get:
      operationId: getIndustryComparison
      tags: [value]
      summary: Compares a company against a deterministic sector peer group, fetched on demand
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Industry comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndustryComparisonResult"
        "404":
          description: Unknown symbol

  /stock-analyst/filings/{symbol}:
    get:
      operationId: getFilingAnalysis
      tags: [value]
      summary: Fetches and extracts a company's most recent 10-K filing, fetched on demand
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Filing analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilingAnalysis"
        "404":
          description: Unknown symbol

  /stock-analyst/management-quality/{symbol}:
    get:
      operationId: getManagementQualityAnalysis
      tags: [value]
      summary: Deterministic management-quality scoring reusing the Document Intelligence Engine and existing analyzers, fetched on demand
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Management quality analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementQualityAnalysis"
        "404":
          description: Unknown symbol

  /stock-analyst/earnings/{symbol}:
    get:
      operationId: getEarningsIntelligence
      tags: [value]
      summary: Quarterly earnings actual-vs-estimate history and deterministic trend analysis, fetched on demand
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Earnings intelligence analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarningsIntelligenceAnalysis"
        "404":
          description: Unknown symbol

components:
  schemas:
    # ─── Value Investing (Buffett-style; all SIMULATED, advisory only) ────────────
    ValueFactorScore:
      type: object
      required: [label, score, detail]
      properties:
        label: { type: string }
        score: { type: number }
        detail: { type: string }

    ValueBusinessQuality:
      type: object
      required: [score, rating, factors, summary]
      properties:
        score: { type: number }
        rating:
          type: string
          enum: [Wonderful, Good, Average, Weak]
        factors:
          type: array
          items: { $ref: "#/components/schemas/ValueFactorScore" }
        summary: { type: string }

    ValueMoatSource:
      type: object
      required: [source, strength]
      properties:
        source: { type: string }
        strength: { type: number }

    ValueMoatAnalysis:
      type: object
      required: [rating, score, durabilityYears, sources, summary]
      properties:
        rating:
          type: string
          enum: [Wide, Medium, Narrow, None]
        score: { type: number }
        durabilityYears: { type: number }
        sources:
          type: array
          items: { $ref: "#/components/schemas/ValueMoatSource" }
        summary: { type: string }

    ValueCompetitiveDimensionScore:
      type: object
      required: [dimension, score, weight, detail]
      properties:
        dimension: { type: string }
        score: { type: number, nullable: true }
        weight: { type: number }
        detail: { type: string }
        reason: { type: string }

    ValueCompetitiveAdvantageAnalysis:
      type: object
      required: [score, dimensions, classification, strengths, weaknesses, confidenceLevel, confidenceExplanation, summary]
      properties:
        score: { type: number, nullable: true }
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/ValueCompetitiveDimensionScore" }
        classification:
          type: string
          enum: [Wide, Medium, Narrow, None]
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        confidenceLevel:
          type: string
          enum: [High, Moderate, Low]
        confidenceExplanation: { type: string }
        summary: { type: string }

    ValueFinancialStrength:
      type: object
      required: [rating, score, metrics, flags, summary]
      properties:
        rating:
          type: string
          enum: [Strong, Acceptable, Weak, Risky]
        score: { type: number }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ValueFactorScore" }
        flags:
          type: array
          items: { type: string }
        summary: { type: string }

    ValueFairValueMethod:
      type: object
      required: [method, fairValue, detail]
      properties:
        method: { type: string }
        fairValue: { type: number }
        detail: { type: string }

    ValueValuation:
      type: object
      required: [available, dataSource, price, summary]
      properties:
        available: { type: boolean }
        dataSource: { type: string }
        price: { type: number }
        summary: { type: string }
        fairValue: { type: number }
        fairValueLow: { type: number }
        fairValueHigh: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        reason: { type: string }

    ValueGrahamValuation:
      type: object
      required: [available, price, summary]
      properties:
        available: { type: boolean }
        price: { type: number }
        summary: { type: string }
        grahamNumber: { type: ["number", "null"] }
        growthFormulaValue: { type: ["number", "null"] }
        fairValue: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        reason: { type: string }

    ValueDcfValuation:
      type: object
      required: [available, price, discountRate, terminalGrowthRate, summary]
      properties:
        available: { type: boolean }
        price: { type: number }
        discountRate: { type: number }
        terminalGrowthRate: { type: number }
        summary: { type: string }
        projectionYears: { type: number }
        projectedFreeCashFlows:
          type: array
          items: { type: number }
        terminalValue: { type: number }
        fairValue: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        confidenceLabel:
          type: string
          enum: [High, Moderate, Low]
        confidenceExplanation: { type: string }
        reason: { type: string }

    ValueBuffettValuation:
      type: object
      required: [available, price, requiredReturn, summary]
      properties:
        available: { type: boolean }
        price: { type: number }
        requiredReturn: { type: number }
        summary: { type: string }
        ownerEarnings: { type: number }
        fairValue: { type: number }
        methods:
          type: array
          items: { $ref: "#/components/schemas/ValueFairValueMethod" }
        marginOfSafety: { type: number }
        marginOfSafetyLabel:
          type: string
          enum: [High, Medium, Low, None]
        rating:
          type: string
          enum: [Cheap, Fair, Expensive, Very Expensive]
        reason: { type: string }

    ValueQualityMetricScore:
      type: object
      required: [metric, availability, weight, detail]
      properties:
        metric: { type: string }
        availability:
          type: string
          enum: [available, unavailable]
        score: { type: ["number", "null"] }
        weight: { type: number }
        detail: { type: string }
        reason: { type: string }

    ValueInvestmentQuality:
      type: object
      required: [metrics, strengths, weaknesses, confidenceLevel, confidenceExplanation, summary]
      properties:
        score: { type: ["number", "null"] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/ValueQualityMetricScore" }
        strengths:
          type: array
          items: { type: string }
        weaknesses:
          type: array
          items: { type: string }
        confidenceLevel:
          type: string
          enum: [High, Moderate, Low]
        confidenceExplanation: { type: string }
        summary: { type: string }

    ValueModelFairValue:
      type: object
      required: [model, fairValue]
      properties:
        model: { type: string }
        fairValue: { type: number }

    ValueConsolidatedMarginOfSafety:
      type: object
      required: [price, modelsConsidered, modelsAvailable, fairValues, agreement, summary]
      properties:
        price: { type: number }
        modelsConsidered: { type: number }
        modelsAvailable: { type: number }
        fairValues:
          type: array
          items: { $ref: "#/components/schemas/ValueModelFairValue" }
        minFairValue: { type: ["number", "null"] }
        maxFairValue: { type: ["number", "null"] }
        averageFairValue: { type: ["number", "null"] }
        averageMarginOfSafety: { type: ["number", "null"] }
        agreement:
          type: string
          enum: [unanimous, majority, split, insufficient-data]
        summary: { type: string }

    ValueTomNashPillarScore:
      type: object
      required: [label, detail]
      properties:
        label: { type: string }
        score: { type: ["number", "null"] }
        detail: { type: string }

    ValueSectorMacroContext:
      type: object
      required: [sector, industry, macroRegime, macroRegimeLabel, detail]
      properties:
        sector: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        macroRegime:
          type: string
          enum: [rising_rates, falling_rates, stable_rates]
        macroRegimeLabel: { type: string }
        detail: { type: string }

    ValueRateSensitivityAnalysis:
      type: object
      required: [durationScore, classification, sensitivityLabel, detail]
      properties:
        durationScore: { type: number }
        classification:
          type: string
          enum: ["Long-Duration Growth", "Value / Short-Duration", Blend]
        sensitivityLabel: { type: string }
        detail: { type: string }

    ValueAiTechCycleAnalysis:
      type: object
      required: [score, label, detail]
      properties:
        score: { type: number }
        label:
          type: string
          enum: [High, Moderate, Low]
        detail: { type: string }

    ValueTomNashAnalysis:
      type: object
      required: [businessQuality, growth, capitalAllocation, financialStrength, valuation, sectorMacro, rateSensitivity, aiTechCycle, dataCompleteness, convictionScore, verdict, rationale, summary]
      properties:
        businessQuality: { $ref: "#/components/schemas/ValueTomNashPillarScore" }
        growth: { $ref: "#/components/schemas/ValueTomNashPillarScore" }
        capitalAllocation: { $ref: "#/components/schemas/ValueTomNashPillarScore" }
        financialStrength: { $ref: "#/components/schemas/ValueTomNashPillarScore" }
        valuation: { $ref: "#/components/schemas/ValueTomNashPillarScore" }
        sectorMacro: { $ref: "#/components/schemas/ValueSectorMacroContext" }
        rateSensitivity: { $ref: "#/components/schemas/ValueRateSensitivityAnalysis" }
        aiTechCycle: { $ref: "#/components/schemas/ValueAiTechCycleAnalysis" }
        dataCompleteness: { type: number }
        convictionScore: { type: number }
        verdict:
          type: string
          enum: [Buy, Hold, Wait]
        rationale:
          type: array
          items: { type: string }
        summary: { type: string }

    ValueCommitteeVote:
      type: object
      required: [analyst, verdict, confidence, rationale]
      properties:
        analyst:
          type: string
          enum: [Graham, Buffett, Tom Nash]
        verdict:
          type: string
          enum: [Buy, Hold, Wait]
        confidence: { type: number }
        rationale: { type: string }

    ValueInvestmentCommittee:
      type: object
      required: [votes, consolidatedVerdict, confidenceScore, agreement, reasoning, summary]
      properties:
        votes:
          type: array
          items: { $ref: "#/components/schemas/ValueCommitteeVote" }
        consolidatedVerdict:
          type: string
          enum: [Buy, Hold, Wait]
        confidenceScore: { type: number }
        agreement:
          type: string
          enum: [unanimous, majority, split, insufficient-data]
        reasoning:
          type: array
          items: { type: string }
        summary: { type: string }

    ValueRatioMetric:
      type: object
      required: [label, available, displayValue]
      properties:
        label: { type: string }
        value: { type: ["number", "null"] }
        displayValue: { type: string }
        available: { type: boolean }
        reason: { type: string }

    ValueRatioTrend:
      type: object
      required: [label, history]
      properties:
        label: { type: string }
        history:
          type: array
          items: { type: number }

    ValueFinancialRatios:
      type: object
      required: [valuation, profitability, liquidityAndLeverage, trends, summary]
      properties:
        valuation:
          type: array
          items: { $ref: "#/components/schemas/ValueRatioMetric" }
        profitability:
          type: array
          items: { $ref: "#/components/schemas/ValueRatioMetric" }
        liquidityAndLeverage:
          type: array
          items: { $ref: "#/components/schemas/ValueRatioMetric" }
        trends:
          type: array
          items: { $ref: "#/components/schemas/ValueRatioTrend" }
        summary: { type: string }

    ValueDecision:
      type: object
      required: [verdict, conviction, rationale, summary]
      properties:
        verdict:
          type: string
          enum: [LONG-TERM BUY, BUY ONLY ON PULLBACK, WATCHLIST, HOLD, TRIM, AVOID]
        conviction: { type: number }
        rationale:
          type: array
          items: { type: string }
        summary: { type: string }

    ValueStockVsOptions:
      type: object
      required: [verdict, stockCase, optionsCase, summary]
      properties:
        verdict:
          type: string
          enum: [Long-term stock, Options income, Both, Watchlist only, Avoid]
        ivRank: { type: ["number", "null"] }
        stockCase: { type: string }
        optionsCase: { type: string }
        summary: { type: string }

    ValueKeyMetric:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }

    ValueRiskFlag:
      type: object
      required: [severity, text]
      properties:
        severity:
          type: string
          enum: [low, medium, high]
        text: { type: string }

    ValueReportSection:
      type: object
      required: [id, title, body]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        bullets:
          type: array
          items: { type: string }

    ValueFundamentalsFallback:
      type: object
      required: [attemptedProvider, reason, message]
      properties:
        attemptedProvider: { type: string }
        reason:
          type: string
          enum: [rate_limit, error, no_data]
        message: { type: string }

    ValueResearchReport:
      type: object
      required:
        [symbol, name, kind, asOf, fetchedAt, dataSource, simulated, price, sector, industry, businessQuality, investmentQuality, moat, competitiveAdvantage, financialStrength, financialRatios, valuation, grahamValuation, dcfValuation, buffettValuation, consolidatedMarginOfSafety, tomNash, investmentCommittee, decision, stockVsOptions, keyMetrics, risks, sections, disclaimer]
      properties:
        symbol: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [stock, etf]
        asOf: { type: string }
        fetchedAt: { type: string }
        dataSource: { type: string }
        simulated: { type: boolean }
        fallback: { $ref: "#/components/schemas/ValueFundamentalsFallback" }
        price: { type: number }
        sector: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        businessQuality: { $ref: "#/components/schemas/ValueBusinessQuality" }
        investmentQuality: { $ref: "#/components/schemas/ValueInvestmentQuality" }
        moat: { $ref: "#/components/schemas/ValueMoatAnalysis" }
        competitiveAdvantage: { $ref: "#/components/schemas/ValueCompetitiveAdvantageAnalysis" }
        financialStrength: { $ref: "#/components/schemas/ValueFinancialStrength" }
        financialRatios: { $ref: "#/components/schemas/ValueFinancialRatios" }
        valuation: { $ref: "#/components/schemas/ValueValuation" }
        grahamValuation: { $ref: "#/components/schemas/ValueGrahamValuation" }
        dcfValuation: { $ref: "#/components/schemas/ValueDcfValuation" }
