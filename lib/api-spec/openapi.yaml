    ReportOpportunity:
      type: object
      required: [symbol, strategy, ravishScore, ravishTier, pop, ev, theta, eventRiskLevel]
      properties:
        symbol:
          type: string
        strategy:
          type: string
        ravishScore:
          type: integer
        ravishTier:
          type: string
        pop:
          type: number
        ev:
          type: number
        theta:
          type: number
        eventRiskLevel:
          type: string

    TradeToAvoid:
      type: object
      required: [symbol, symbolName, reason, level]
      properties:
        symbol:
          type: string
        symbolName:
          type: string
        reason:
          type: string
        level:
          type: string
        earningsInDays:
          type: integer
          nullable: true

    DailyReport:
      type: object
      required:
        [date, generatedAt, health, summary, market, positions, opportunities, tradesToAvoid, disclaimer]
      properties:
        id:
          type: integer
        date:
          type: string
        generatedAt:
          type: string
        briefing:
          type: string
        briefingSource:
          type: string
        health:
          $ref: "#/components/schemas/PortfolioHealth"
        summary:
          $ref: "#/components/schemas/ReportSummary"
        market:
          $ref: "#/components/schemas/MarketBriefing"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PositionThreat"
        opportunities:
          type: array
          items:
            $ref: "#/components/schemas/ReportOpportunity"
        tradesToAvoid:
          type: array
          items:
            $ref: "#/components/schemas/TradeToAvoid"
        disclaimer:
          type: string

    CompareReportsRequest:
      type: object
      required: [fromId, toId]
      properties:
        fromId:
          type: integer
        toId:
          type: integer

    CompareReportsResponse:
      type: object
      required: [narration, narrationSource]
      properties:
        narration:
          type: string
        narrationSource:
          type: string
          enum: [llm, template]

    DailyReportSummary:
      type: object
      required:
        [id, reportDate, healthScore, healthLabel, exposureScore, riskScore, openPositions, redCount, yellowCount, netTheta, createdAt]
      properties:
        id:
          type: integer
        reportDate:
          type: string
        healthScore:
          type: integer
        healthLabel:
          type: string
        exposureScore:
          type: integer
        riskScore:
          type: integer
        openPositions:
          type: integer
        redCount:
          type: integer
        yellowCount:
          type: integer
        netTheta:
          type: number
        briefing:
          type: string
        createdAt:
          type: string

    DeleteReportResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: integer
        deleted:
          type: boolean

    RestorableReport:
      type: object
      required:
        [reportDate, healthScore, healthLabel, exposureScore, riskScore, openPositions, redCount, yellowCount, netTheta, briefing, briefingSource, payload, createdAt]
      properties:
        reportDate:
          type: string
        healthScore:
          type: integer
        healthLabel:
          type: string
        exposureScore:
          type: integer
        riskScore:
          type: integer
        openPositions:
          type: integer
        redCount:
          type: integer
        yellowCount:
          type: integer
        netTheta:
          type: number
        briefing:
          type: string
        briefingSource:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string

    ClearReportsResult:
      type: object
      required: [deleted, reports]
      properties:
        deleted:
          type: integer
        reports:
          type: array
          items:
            $ref: "#/components/schemas/RestorableReport"

    RestoreReportsRequest:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/RestorableReport"

    RestoreReportsResult:
      type: object
      required: [restored]
      properties:
        restored:
          type: integer
