        marketDataProvider:
          type: string
          enum: [mock, alpaca, polygon]
        defaultDte:
          type: integer
        shortDelta:
          type: number
        minIvRank:
          type: number
        autoExecuteEnabled:
          type: boolean
        autoMaxTradesPerDay:
          type: integer
        autoMaxConcurrentPositions:
          type: integer
        autoMinRavishScore:
          type: number
        autoMaxDailyLossPct:
          type: number
        autoQuantityPerTrade:
          type: integer
        adjDeltaDriftTrigger:
          type: number
        adjPopDropTrigger:
          type: number
        adjShortStrikeProximityPct:
          type: number
        adjIvExpansionTrigger:
          type: number
        adjDteTrigger:
          type: integer
        autoAdjustEnabled:
          type: boolean
        eventRiskEnabled:
          type: boolean
        eventRiskBlockEarningsShortPremium:
          type: boolean
        eventRiskAutoBlockHigh:
          type: boolean
        fundamentalsProvider:
          type: string
          enum: [simulated, alpha_vantage, financial_modeling_prep]
        fundamentalsStalenessHours:
          type: integer
        fundamentalsAutoRefresh:
          type: boolean
        investingRiskFreeRate:
          type: number
        investingDefaultDiscountRate:
          type: number
        investingFilingsProvider:
          type: string
        tradingDataProvider:
          type: string
        tradingAccountValue:
