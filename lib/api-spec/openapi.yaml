openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DK Option Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: monitoring
    description: Operational monitoring — background-job health, database connectivity, request-error rate, and audit-log-derived alerting signals (Phase 6, Sprint 74)
  - name: scanner
    description: Daily options scanner
  - name: options
    description: Option chain data
  - name: portfolio
    description: Portfolio positions and Greeks
  - name: trades
    description: Trade management
  - name: backtest
    description: Strategy backtesting
  - name: scoring
    description: Ravish Score AI ranking
  - name: journal
    description: Trade journal
  - name: ai
    description: AI Options Assistant
  - name: settings
    description: User settings
  - name: performance
    description: Performance analytics
  - name: value
    description: Buffett-style value-investing research & education (SIMULATED, advisory only)
  - name: portfolio-construction
    description: Target-allocation portfolio construction for value investing (advisory/education only, never places an order — distinct from the options-income "portfolio" tag)
  - name: trading-journal
    description: Trading journal for Engine 2 (Institutional Trading Engine) positions — mirrors the options "journal" tag's shape, distinct table/records, advisory only, never places an order
  - name: trading-structure
    description: Engine 2 Market Structure analysis (support/resistance zones, trend classification) — SIMULATED-first, advisory only, never places an order
  - name: trading-multi-timeframe
    description: Engine 2 Multi-Timeframe trend confluence analysis — composes Market Structure across multiple timeframes, SIMULATED-first, advisory only, never places an order
  - name: trading-regime
    description: Engine 2 Market Regime analysis — composes trend (Multi-Timeframe), liquidity, and realized-volatility axes into a single regime read, SIMULATED-first, advisory only, never places an order
  - name: trading-probability
    description: Engine 2 Probability analysis — a driftless lognormal probability cone (±1σ/±2σ) and honest availability, composed on Market Regime's own resolved price/volatility, SIMULATED-first, advisory only, never places an order
  - name: trading-positions
    description: Engine 2 trading position ledger (open/closed positions, entry/stop/target) — instrument-agnostic, distinct from the options-income "trades" table, advisory only, never places an order
  - name: trading-risk
    description: Engine 2 portfolio risk analysis (position sizing, stop/target discipline, portfolio risk budget) over the calling user's own trading_positions, composed on Market Regime's own resolved price/volatility for touch-probability context, SIMULATED-first, advisory only, never places an order
  - name: trading-liquidity
    description: Engine 2 Liquidity / Order Flow analysis (volume profile, dollar-volume liquidity score, buy/sell pressure proxy) — a sibling engine to Market Structure, not built on top of it, SIMULATED-first, advisory only, never places an order
  - name: trading-coach
    description: Engine 2 AI Trade Coach — free-form Q&A grounded in Structure/Multi-Timeframe/Liquidity/Regime/Probability, the calling user's own portfolio Risk analysis, and recent Trading Journal reflections, SIMULATED-first, educational only, never places an order
  - name: trading-backtest
    description: Engine 2 Backtesting — a genuine walk-forward price-action backtest replaying SIMULATED candles through a named entry/exit rule set (trend-following, mean-reversion, structure-breakout), producing a real trade log and equity curve, SIMULATED-first, advisory only, never places an order
  - name: broker
    description: Read-only Alpaca Paper Trading broker/account verification (account balances, open positions, open orders, connection health) — Paper Trading endpoint only, never places, modifies, or cancels an order

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Monitoring (Phase 6, Sprint 74) ────────────────────────────────────
  /monitoring/status:
    get:
      operationId: getMonitoringStatus
      tags: [monitoring]
      summary: Operational health status — database, background jobs, request-error rate, and active alerts
      responses:
        "200":
          description: Current monitoring status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringStatus"

  # ─── Scanner ───────────────────────────────────────────────────────────────
  /scanner/results:
    get:
      operationId: getScannerResults
      tags: [scanner]
      summary: Get latest scanner results
      parameters:
        - name: strategy
          in: query
          schema:
            type: string
            enum: [iron_condor, iron_fly, calendar_spread, earnings]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Scanner results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScannerResult"

  /scanner/run:
    post:
      operationId: runScanner
      tags: [scanner]
      summary: Trigger a new scanner run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScannerRunInput"
      responses:
        "200":
          description: Scanner started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerRunResponse"

  /scanner/top:
    get:
      operationId: getTopOpportunities
      tags: [scanner]
      summary: Get top-ranked trade opportunities across all strategies
      responses:
        "200":
          description: Top opportunities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopOpportunities"

  /scanner/earnings:
    get:
      operationId: getEarningsScan
      tags: [scanner]
      summary: Scan for near-term earnings with elevated IV and recommended structures
      responses:
        "200":
          description: Earnings plays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EarningsPlay"

  /events:
    get:
      operationId: getUpcomingEvents
      tags: [scanner]
      summary: Upcoming economic / market event calendar (earnings, FOMC, CPI, jobs, dividends)
      parameters:
        - name: horizonDays
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Upcoming events sorted by date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventRiskEvent"

  /market-data/health:
    get:
      operationId: getMarketDataHealth
      tags: [scanner]
      summary: Get options market-data provider status and last-scan health metrics
      responses:
        "200":
          description: Market data health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataHealth"

  # ─── Broker (Alpaca Paper Trading, read-only) ──────────────────────────────
  /broker/health:
    get:
      operationId: getBrokerHealth
      tags: [broker]
      summary: Get Alpaca Paper Trading broker connection/account health (read-only)
      description: >-
        Performs a live, authenticated read-only round trip to Alpaca's Paper
        Trading API (GET /v2/account, /v2/positions, /v2/orders) and reports
        connection status, account balances, and open position/order counts.
        Never places, modifies, or cancels an order. Always targets Alpaca's
        Paper Trading endpoint — there is no live-trading equivalent.
      responses:
        "200":
          description: Broker health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerHealth"

  /broker/orders:
    get:
      operationId: getBrokerOrders
      tags: [broker]
      summary: List all Alpaca Paper Trading orders (any status), read-only
      description: >-
        A thin, read-only pass-through to GET /v2/orders?status=all. Never
        places, modifies, or cancels an order. Bounded to Alpaca's own
        default page size (no further pagination this sprint).
      responses:
        "200":
          description: Broker orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerOrdersResult"

  /broker/orders/{orderId}:
    get:
      operationId: getBrokerOrder
      tags: [broker]
      summary: Get a single Alpaca Paper Trading order by id, read-only
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Broker order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerOrderResult"

  /broker/positions:
    get:
      operationId: getBrokerPositions
      tags: [broker]
      summary: List all Alpaca Paper Trading positions, read-only
      description: >-
        A thin, read-only pass-through to GET /v2/positions. Distinct from
        GET /broker/reconciliation's own positions array, which is a
        local-vs-broker comparison, not a plain display list — this route
        surfaces Alpaca's own position fields (average entry price, side,
        market value, unrealized P/L) directly. Never modifies or closes a
        position.
      responses:
        "200":
          description: Broker positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrokerPositionsResult"

  /broker/reconciliation:
    get:
      operationId: getBrokerReconciliation
      tags: [broker]
      summary: Compare local trade/order records against Alpaca Paper Trading orders and positions, read-only
      description: >-
        Manual, on-demand only — never runs on a schedule or background
        timer. Read-only: identifies discrepancies (missing at broker,
        missing locally, status/quantity/symbol mismatches, open-position
        mismatches) without correcting, cancelling, or closing anything on
        either side.
      responses:
        "200":
          description: Reconciliation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationResult"

  # ─── Options Chain ─────────────────────────────────────────────────────────
  /options/chain/{symbol}:
    get:
      operationId: getOptionChain
      tags: [options]
      summary: Get live option chain for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Option chain data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionChain"

  /options/universe:
    get:
      operationId: getUniverse
      tags: [options]
      summary: Get the list of tracked symbols with market data
      responses:
        "200":
          description: Universe symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniverseSymbol"

  /options/expirations/{symbol}:
    get:
      operationId: getExpirations
      tags: [options]
      summary: Get available expiration dates for a symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Expiration dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpirationDate"

  # ─── Portfolio ──────────────────────────────────────────────────────────────
  /portfolio/positions:
    get:
      operationId: getPortfolioPositions
      tags: [portfolio]
      summary: Get live Alpaca positions
      responses:
        "200":
          description: Portfolio positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

  /portfolio/greeks:
    get:
      operationId: getPortfolioGreeks
      tags: [portfolio]
      summary: Get aggregate portfolio Greeks
      responses:
        "200":
          description: Portfolio Greeks summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioGreeks"

  /portfolio/summary:
    get:
      operationId: getPortfolioSummary
      tags: [portfolio]
      summary: Get portfolio account summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"

  /portfolio/risk:
    get:
      operationId: getRiskStatus
      tags: [portfolio]
      summary: Get portfolio risk status and limit compliance
      responses:
        "200":
          description: Risk status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskStatus"

  /portfolio/theta:
    get:
      operationId: getThetaIncome
      tags: [portfolio]
      summary: Get theta income across horizons with symbol/strategy breakdowns
      responses:
        "200":
          description: Theta income
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThetaIncome"

  # ─── Trades ─────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all trades
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, closed, pending]
        - name: strategy
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Create and execute a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Trade created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
    delete:
      operationId: closeTrade
      tags: [trades]
      summary: Close / exit a trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"

  /trades/adjustments:
    get:
      operationId: listTradeAdjustments
      tags: [trades]
      summary: Adjustment recommendations for every open trade
      responses:
        "200":
          description: One recommendation per open position
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeAdjustment"

  /trades/{id}/adjustment:
    get:
      operationId: getTradeAdjustment
      tags: [trades]
      summary: Adjustment recommendation for a single trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Adjustment recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeAdjustment"

  /trades/{id}/monitor:
    get:
      operationId: getTradeMonitor
      tags: [trades]
      summary: Get real-time monitoring data for an open trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade monitoring data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeMonitor"

  # ─── Execution (Phase 5: semi-automatic) ────────────────────────────────────
  /execution/preview:
    post:
      operationId: previewExecution
      tags: [execution]
      summary: Build option order legs, compute metrics, and run pre-trade risk validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionPreviewInput"
      responses:
        "200":
          description: Execution ticket with order legs, metrics, and validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionTicket"

  /execution/submit:
    post:
      operationId: submitExecution
      tags: [execution]
      summary: Submit a validated multi-leg order through the broker (semi-auto only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionSubmitInput"
      responses:
        "201":
          description: Order submitted; pending trade and journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionSubmitResult"

  /execution/adjustment/preview:
    post:
      operationId: previewAdjustmentExecution
      tags: [execution]
      summary: Build a ready-to-submit roll/convert ticket for an open position's recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentPreviewInput"
      responses:
        "200":
          description: Execution ticket for the recommended roll/convert structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionTicket"

  /execution/adjustment/submit:
    post:
      operationId: submitAdjustmentExecution
      tags: [execution]
      summary: Close the source position and open the recommended roll/convert structure (semi-auto only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentSubmitInput"
      responses:
        "201":
          description: Source position closed; rolled/converted trade and journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentSubmitResult"

  # ─── Order Preview & Risk Simulator (Paper Trading dry-run) ─────────────────
  /execution/order-preview:
    post:
      operationId: previewOrder
      tags: [execution]
      summary: >-
        Read-only dry-run order preview: never routes to a broker, never
        creates an order, never mutates local state. Always returns 200 —
        an unresolvable/invalid input honestly sets available:false and
        populates inputIssues rather than fabricating a partial ticket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPreviewInput"
      responses:
        "200":
          description: Order preview result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPreviewResult"

  # ─── Full-Auto execution (Phase 6) ──────────────────────────────────────────
  /execution/auto/status:
    get:
      operationId: getAutoExecutionStatus
      tags: [execution]
      summary: Current full-auto engine state, guardrails, and today's stats
      responses:
        "200":
          description: Auto-execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoExecutionStatus"

  /execution/auto/log:
    get:
      operationId: getAutoExecutionLog
      tags: [execution]
      summary: Recent full-auto decision audit log
      responses:
        "200":
          description: Audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoExecutionLogEntry"

  /execution/auto/adjust/log:
    get:
      operationId: getAutoAdjustmentLog
      tags: [execution]
      summary: Recent auto-ADJUSTMENT decision audit log (kind=adjust only)
      parameters:
        - name: decision
          in: query
          required: false
          schema:
            type: string
            enum: [executed, skipped, rejected, blocked]
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Adjustment audit log entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutoExecutionLogEntry"

  /execution/auto/run:
    post:
      operationId: runAutoExecutionCycle
      tags: [execution]
      summary: Run one full-auto cycle now (no-op unless armed); returns decisions
      responses:
        "200":
          description: Cycle result with per-candidate decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoCycleResult"

  /execution/auto/adjust/run:
    post:
      operationId: runAutoAdjustmentCycle
      tags: [execution]
      summary: Run one auto-adjustment cycle now (no-op unless armed); de-risk only
      responses:
        "200":
          description: Adjustment cycle result with per-trade decisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoAdjustCycleResult"

  # ─── Backtest ────────────────────────────────────────────────────────────────
  /backtest/run:
    post:
      operationId: runBacktest
      tags: [backtest]
      summary: Run a strategy backtest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BacktestInput"
      responses:
        "200":
          description: Backtest results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacktestResult"

  /backtest/results:
    get:
      operationId: listBacktestResults
      tags: [backtest]
      summary: List saved backtest results
      responses:
        "200":
          description: Backtest results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BacktestResult"

  # ─── Ravish Score ────────────────────────────────────────────────────────────
  /scoring/{symbol}:
    get:
      operationId: getRavishScore
      tags: [scoring]
      summary: Get Ravish Score for a symbol across all strategies
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ravish Score breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RavishScore"

  /scoring/leaderboard:
    get:
      operationId: getScoringLeaderboard
      tags: [scoring]
      summary: Get top-scored opportunities across all symbols
      responses:
        "200":
          description: Leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RavishScore"

  # ─── Journal ─────────────────────────────────────────────────────────────────
  /journal:
    get:
      operationId: listJournalEntries
      tags: [journal]
      summary: List journal entries
      responses:
        "200":
          description: Journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Journal entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal/{id}:
    get:
      operationId: getJournalEntry
      tags: [journal]
      summary: Get a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    patch:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update a journal entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryUpdate"
      responses:
        "200":
          description: Updated journal entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  # ─── AI Assistant ─────────────────────────────────────────────────────────────
  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Send a message to the AI options assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswer"

  /ai/messages:
    get:
      operationId: getAiMessages
      tags: [ai]
      summary: Get chat history
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiMessage"

  # ─── AI Trading Coach ─────────────────────────────────────────────────────────
  /coach/explain-trade:
    post:
      operationId: explainTrade
      tags: [coach]
      summary: Explain a scanner candidate or symbol+strategy (read-only, never executes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainTradeInput"
      responses:
        "200":
          description: Deterministic explanation plus narrative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainTradeResult"

  /coach/teach-greek:
    post:
      operationId: teachGreek
      tags: [coach]
      summary: Tutor one of the four Greeks with a live worked example
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeachGreekInput"
