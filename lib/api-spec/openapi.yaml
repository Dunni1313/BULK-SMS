    MarketDataHealth:
      type: object
      required: [provider, requestedProvider, mode, connected, reason, symbolsScanned, contractsScanned, rejectedByLiquidity, rejectedByRisk, positiveEvFound]
      properties:
        provider:
          type: string
          enum: [mock, alpaca, polygon]
        requestedProvider:
          type: string
          enum: [mock, alpaca, polygon]
        mode:
          type: string
          enum: [mock, live]
        connected:
          type: boolean
        reason:
          type: string
        lastChainUpdate:
          type: ["string", "null"]
        symbolsScanned:
          type: integer
        contractsScanned:
          type: integer
        rejectedByLiquidity:
          type: integer
        rejectedByRisk:
          type: integer
        positiveEvFound:
          type: integer
        lastScannedAt:
          type: ["string", "null"]

    BrokerHealth:
      type: object
      required: [connected, authenticationSuccessful, reason, checkedAt]
      properties:
        connected:
          type: boolean
          description: True only when Alpaca's own account endpoint was reached and authenticated successfully this check.
        authenticationSuccessful:
          type: boolean
          description: True only when the configured credentials were accepted by Alpaca — currently always equal to `connected`, kept as a distinct field since a future check may reach Alpaca but fail some other way.
        accountStatus:
          type: ["string", "null"]
          description: Alpaca's own account status string (e.g. ACTIVE), null when not connected.
        buyingPower:
          type: ["number", "null"]
        cashBalance:
          type: ["number", "null"]
        portfolioValue:
          type: ["number", "null"]
        openPositionsCount:
          type: ["integer", "null"]
        openOrdersCount:
          type: ["integer", "null"]
        lastSuccessfulCheckAt:
          type: ["string", "null"]
          description: Timestamp of the most recent check that authenticated successfully — never updated by a failed check, so a broken connection never appears "recently successful."
        reason:
          type: string
          description: Human-readable explanation of the current status (never connected/not connected/authentication failed).
        checkedAt:
          type: string
          description: Timestamp of this specific check.

    NormalizedOrderStatus:
      type: string
      enum: [new, accepted, pending, partially_filled, filled, cancelled, rejected, expired, unknown]
      description: This platform's own normalized order-lifecycle bucket, mapped from Alpaca's larger raw status vocabulary — see lib/providers/alpacaOrderLifecycle.ts.

    BrokerOrder:
      type: object
      required: [id, symbol, side, qty, type, status, normalizedStatus, filledQty, filledAvgPrice, submittedAt]
      properties:
