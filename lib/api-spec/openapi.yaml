    # Phase 12 — a plain, ownership-scoped read of the user's own Engine 1
    # Value Watchlist (value_watchlist), reviewed by the Institutional
    # Mentor. Introduces no new scoring — currentDecision/marginOfSafetyTarget
    # are already-stored fields on the watchlist row itself.
    MentorWatchlistReviewItem:
      type: object
      required: [symbol, category, currentDecision, marginOfSafetyTarget, reason, lastResearchedAt]
      properties:
        symbol: { type: string }
        category: { type: string }
        currentDecision: { type: string }
        marginOfSafetyTarget: { type: number }
        reason: { type: string }
        lastResearchedAt: { type: ["string", "null"] }

    MentorWatchlistReview:
      type: object
      required: [itemCount, items, summary]
      properties:
        itemCount: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/MentorWatchlistReviewItem"
        summary: { type: string }

    # Phase 13 — a plain, ownership-scoped read of the user's own Engine 1
    # target-allocation portfolios (investing_portfolios/investing_holdings),
    # reviewed by the Institutional Mentor. Introduces no new scoring —
    # portfolio/holding counts only, never lib/portfolioIntelligence.ts's own
    # on-demand analyzer composition.
    MentorPortfolioReview:
      type: object
      required: [portfolioCount, totalHoldingsCount, summary]
      properties:
        portfolioCount: { type: integer }
        totalHoldingsCount: { type: integer }
        summary: { type: string }

    # Phase 14 — a plain, ownership-scoped count of the user's own saved
    # Decision Engine snapshots/notes, reviewed by the Institutional Mentor.
    # Introduces no new scoring — never a call into lib/decisionEngine.ts's
    # own per-symbol composition, which stays on-demand behind its own route.
    MentorDecisionEngineReview:
      type: object
      required: [snapshotCount, noteCount, distinctSymbolCount, summary]
      properties:
        snapshotCount: { type: integer }
        noteCount: { type: integer }
        distinctSymbolCount: { type: integer }
        summary: { type: string }

    # Phase 15 — a plain, ownership-scoped count of the user's own saved
    # Screener filter sets, reviewed by the Institutional Mentor. Introduces
    # no new scanning/ranking — never a call into lib/opportunityDiscovery.ts's
    # own scan orchestration, which stays on-demand behind its own page.
    MentorOpportunityDiscoveryReview:
      type: object
      required: [savedScreenCount, summary]
      properties:
        savedScreenCount: { type: integer }
        summary: { type: string }

    InstitutionalMentorResult:
      type: object
      required:
        [
          paperTradingMode,
          deterministicAnalysis,
          educationalOnly,
          scorecard,
          professionalReview,
          decisionReview,
          capitalAllocationReview,
          riskReview,
          incomeReview,
          behaviourReview,
          learningSummary,
          watchlistReview,
          portfolioReview,
          decisionEngineReview,
          opportunityDiscoveryReview,
          generatedAt,
