components:
  schemas:
    # ─── Value Investing (Buffett-style; all SIMULATED, advisory only) ────────────
    ValueFactorScore:
      type: object
      required: [label, score, detail]
      properties:
        label: { type: string }
        score: { type: number }
        detail: { type: string }

    ValueBusinessQuality:
      type: object
      required: [score, rating, factors, summary]
      properties:
        score: { type: number }
        rating:
          type: string
          enum: [Wonderful, Good, Average, Weak]
        factors:
          type: array
          items: { $ref: "#/components/schemas/ValueFactorScore" }
        summary: { type: string }

    ValueMoatSource:
      type: object
      required: [source, strength]
      properties:
        source: { type: string }
        strength: { type: number }

    ValueMoatAnalysis:
      type: object
      required: [rating, score, durabilityYears, sources, summary]
      properties:
        rating:
          type: string
          enum: [Wide, Medium, Narrow, None]
        score: { type: number }
        durabilityYears: { type: number }
