    # ─── Earnings & Market Data ──────────────────────────────────────────────────
    EarningsPlay:
      type: object
      required: [symbol, name, price, daysToEarnings, iv, ivRank, expectedMovePct, expectedMoveDollars, historicalMovePct, ivCrushPotentialPct, recommendedStrategy, rationale]
      properties:
