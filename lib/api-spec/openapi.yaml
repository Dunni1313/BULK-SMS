  # automatic background tick per lib/monitoringEngine.ts's own disclosed
  # cost-control discipline.
  /monitoring-engine/check:
    post:
      operationId: fullMonitoringCheck
      tags: [notifications]
      summary: >-
        Evaluate every monitoring alert category on demand — watchlist
        targets, risk caps, symbol-level signal changes, portfolio drift/
        concentration, and Opportunity Alerts (saved-screen matches) — and
        persist any newly-triggered alerts (never fabricated; a no-op
        honestly returns an empty array when nothing is newly triggered or
        alerts are disabled)
      responses:
        "200":
          description: Newly created notifications (may be empty)
          content:
            application/json:
              schema:
