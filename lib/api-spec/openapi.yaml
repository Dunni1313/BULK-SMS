  # ─── Market Structure (Engine 2, Phase 3 Sprint 40) ─────────────────────────
  # Deliberately documents the path parameter only. The route also accepts
  # optional ?interval=&lookback= query overrides (defaulting to "1D"/90),
  # validated and handled entirely server-side — kept out of this formal
  # parameter list because Orval's zod+split-types generator produces a
  # genuine duplicate-export collision (GetTradingStructureParams) the one
  # time this spec combines a path param with a query param, confirmed via
  # direct testing to be a toolchain limitation, not a spec error. This
  # mirrors the established precedent (Sprint 30's /value-research/stream)
  # of keeping a route's full surface outside strict OpenAPI modeling when
  # the generator can't cleanly represent it.
  /trading/structure/{symbol}:
    get:
      operationId: getTradingStructure
      tags: [trading-structure]
      summary: Market structure analysis (support/resistance zones, trend classification) for a symbol — SIMULATED-first, honestly labelled dataSource. Accepts optional ?interval= and ?lookback= query overrides, handled server-side only (not part of this typed contract).
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market structure analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingStructureAnalysis"
        "404":
          description: Unknown or invalid symbol

  # ─── Structure Shift Timeline (Engine 2, Phase 26 — Institutional Market
  # Structure Workbench) ────────────────────────────────────────────────────
  # Deliberately documents the path parameter only, matching Sprint 40's own
  # /trading/structure/{symbol} precedent — the route also accepts optional
  # ?interval=&?lookback= query overrides, handled entirely server-side
  # (not part of this typed contract, same disclosed Orval collision reason).
  /trading/structure-timeline/{symbol}:
    get:
      operationId: getTradingStructureTimeline
      tags: [trading-structure]
      summary: A deterministic timeline of structure shift events (new higher high/low, new lower high/low, trend change, range entry/exit, support/resistance test) for a symbol — reuses the existing Market Structure scorer repeatedly over an expanding candle window, zero new scoring. Accepts optional ?interval= and ?lookback= query overrides, handled server-side only.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Structure shift timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingStructureShiftTimeline"
        "404":
          description: Unknown or invalid symbol

  # ─── Multi-Timeframe (Engine 2, Phase 3 Sprint 41) ──────────────────────────
  # Deliberately documents the path parameter only, matching Sprint 40's own
  # precedent for /trading/structure/{symbol} — the route also accepts an
  # optional ?timeframes= override (Phase 26 — Institutional Market Structure
  # Workbench, a comma-separated subset of the 5 real timeframes), handled
  # entirely server-side, so the path+query Orval collision Sprint 40
  # disclosed doesn't reproduce here in the formal spec, but the same
  # documented-surface discipline is kept for consistency.
  /trading/multi-timeframe/{symbol}:
    get:
      operationId: getTradingMultiTimeframe
      tags: [trading-multi-timeframe]
      summary: Multi-timeframe trend confluence analysis for a symbol — composes the Market Structure scorer across multiple timeframes (15m/1h/1D by default; Phase 26 added an optional ?timeframes= override for a caller-chosen subset of the 5 real timeframes, handled server-side only), SIMULATED-first, honestly labelled dataSource
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Multi-timeframe confluence analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingMultiTimeframeAnalysis"
        "404":
          description: Unknown or invalid symbol

