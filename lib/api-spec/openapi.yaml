  # ─── Risk Management (Engine 2, Phase 3 Sprint 44) ──────────────────────────
  /trading/risk:
    get:
      operationId: getTradingRisk
      tags: [trading-risk]
      summary: Portfolio risk analysis over the calling user's own open trading positions — position sizing, stop/target discipline, and portfolio risk budget, SIMULATED-first, honestly reports insufficient data rather than fabricating a default account value or position
      responses:
        "200":
          description: Trading risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingRiskAnalysis"

  # Deliberately documents the path parameter only. The route also accepts
  # optional ?interval=&lookback= query overrides (defaulting to "1D"/90),
  # validated and handled entirely server-side — kept out of this formal
  # parameter list for the same reason routes/tradingStructure.ts's own
  # Sprint 40 path is: Orval's zod+split-types generator produces a genuine
  # duplicate-export collision when a path param and a query param are
  # documented together on the same operation.
  /trading/liquidity/{symbol}:
    get:
      operationId: getTradingLiquidity
      tags: [trading-liquidity]
      summary: Liquidity / Order Flow analysis for a symbol — volume profile, dollar-volume liquidity score, and a buy/sell pressure proxy derived from the candle series' own up/down closes, SIMULATED-first, honestly labelled dataSource
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liquidity analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingLiquidityAnalysis"
        "404":
          description: Unknown or invalid symbol
        "400":
          description: Invalid interval or lookback query override

  # Phase 27 — Institutional Liquidity & Session Workbench. Reuses the
  # trading-liquidity tag. Path-parameter-only, default 1D/90 interval/
  # lookback (matching /trading/liquidity/{symbol}'s own defaults).
  /trading/liquidity-timeline/{symbol}:
    get:
      operationId: getTradingLiquidityTimeline
      tags: [trading-liquidity]
      summary: A deterministic, chronological liquidity timeline for a symbol — replays the existing Liquidity Engine over rolling candle windows (zero new scoring), plus a relative-liquidity comparison (latest window vs. the average of the others) and the full-sample volume profile as Key Liquidity Zones.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liquidity timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingLiquidityTimeline"
        "404":
          description: Unknown or invalid symbol

  # ─── AI Trade Coach (Engine 2, Phase 3 Sprint 47) ───────────────────────────
  # SSE variant at /trading/coach/ask/stream is not modeled here, matching
  # /stock-analyst/value-research/ask's own precedent — orval only models
  # single-shot JSON responses.
  /trading/coach/ask:
    post:
      operationId: askTradingCoach
      tags: [trading-coach]
      summary: Ask a free-form question about a symbol, grounded in Structure/Multi-Timeframe/Liquidity/Regime/Probability, the calling user's own portfolio Risk analysis, and recent Trading Journal reflections (read-only; never executes; SSE variant at /trading/coach/ask/stream is not modeled here)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingCoachAskInput"
      responses:
        "200":
          description: Grounded answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingCoachAskResult"
        "404":
          description: Unknown or invalid symbol

  # ─── Institutional Trading AI Coach (Phase 29) ──────────────────────────────
  # Deterministic (zero-LLM) explanations, mirroring Engine 1's
  # GET /stock-analyst/coach/{coach}/{symbol} (Phase 21) — never predicts
  # price, never invents a probability, never recommends buying/selling.
  /trading/coach/{coach}:
    get:
      operationId: getTradingCoachAccountExplanation
      tags: [trading-coach]
      summary: Deterministic Trading AI Coach explanation for an account-wide coach (journal, psychology) — reuses the calling user's own recent Trading Journal entries verbatim
      parameters:
        - name: coach
          in: path
          required: true
          schema:
            type: string
            enum: [journal, psychology]
      responses:
        "200":
          description: Coach explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingCoachExplanation"
        "400":
          description: Unknown or non-account-scoped coach type

  /trading/coach/{coach}/{symbol}:
    get:
      operationId: getTradingCoachExplanation
      tags: [trading-coach]
      summary: Deterministic Trading AI Coach explanation for a per-symbol coach (structure, liquidity, session, risk, trade-plan) — reuses Structure/Multi-Timeframe/Liquidity/Session/Risk/Trade Plans verbatim
      parameters:
        - name: coach
          in: path
          required: true
          schema:
            type: string
            enum: [structure, liquidity, session, risk, trade-plan]
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Coach explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingCoachExplanation"
        "400":
          description: Unknown or non-symbol-scoped coach type
